<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortre — Personal Finance & Wealth Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Lucide Icons, Chart.js, Export Libraries & Supabase -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#070B14] dark:text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-white transition-colors duration-200">

  <div id="app-root" x-data="fortreApp()" x-init="initApp()" x-cloak class="relative min-h-screen">
    <!-- Animated Dot Matrix Background -->
    <canvas id="dotMatrixCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-70"></canvas>

    <!-- Toast Notifications -->
    <div class="fixed top-4 right-4 z-[90] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0">
      <template x-for="toast in toasts" :key="toast.id">
        <div class="pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl border shadow-xl backdrop-blur-md transition-all"
             :class="{
               'bg-emerald-950/90 border-emerald-500/40 text-emerald-100': toast.type === 'success',
               'bg-amber-950/90 border-amber-500/40 text-amber-100': toast.type === 'warning',
               'bg-rose-950/90 border-rose-500/40 text-rose-100': toast.type === 'error'
             }">
          <i :data-lucide="toast.type === 'success' ? 'check-circle-2' : (toast.type === 'warning' ? 'alert-triangle' : 'x-circle')" class="w-5 h-5 shrink-0 mt-0.5"></i>
          <div class="flex-1 text-xs">
            <p class="font-bold text-sm" x-text="toast.title"></p>
            <p class="opacity-85 mt-0.5" x-text="toast.message"></p>
          </div>
        </div>
      </template>
    </div>

    <!-- ===================================================================== -->
    <!-- 1. HALAMAN LOGIN / AUTH GATE (TAMPIL PERTAMA KALI SEBELUM DASHBOARD)  -->
    <!-- ===================================================================== -->
    <template x-if="!isAuthenticated">
      <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8">
          <!-- Top Bar: Language & Theme -->
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-2.5">
              <!-- Inline SVG Logo Fortre (Tidak akan pernah hilang) -->
              <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/25">
                <svg viewBox="0 0 24 24" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                  <path d="M8 13l3-3 2 2 3-4"/>
                </svg>
              </div>
              <div>
                <h1 class="text-xl font-extrabold tracking-tight">FORTRE</h1>
                <p class="text-[11px] text-slate-500 dark:text-slate-400">Personal Finance Command</p>
              </div>
            </div>

            <div class="flex items-center gap-1.5">
              <button type="button" @click="toggleLang()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" x-text="lang.toUpperCase()"></button>
              <button type="button" @click="toggleDarkMode()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer" title="Ubah Tema">
                <i :data-lucide="darkMode ? 'sun' : 'moon'" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Switch Tab Login / Register -->
          <div class="grid grid-cols-2 gap-1.5 p-1 rounded-2xl bg-slate-100 dark:bg-slate-800/80 mb-6">
            <button type="button" @click="authTab = 'login'; authError = ''"
                    :class="authTab === 'login' ? 'bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-500'"
                    class="py-2 rounded-xl text-xs font-bold transition cursor-pointer">
              <span x-text="lang === 'en' ? 'Sign In' : 'Masuk Akun'"></span>
            </button>
            <button type="button" @click="authTab = 'register'; authError = ''"
                    :class="authTab === 'register' ? 'bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-500'"
                    class="py-2 rounded-xl text-xs font-bold transition cursor-pointer">
              <span x-text="lang === 'en' ? 'Create Account' : 'Daftar Baru'"></span>
            </button>
          </div>

          <!-- Error Alert -->
          <div x-show="authError" class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-500 text-xs font-medium flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span x-text="authError"></span>
          </div>

          <!-- Form Login / Register -->
          <form @submit.prevent="authTab === 'login' ? handleLogin() : handleRegister()" class="space-y-4">
            <div x-show="authTab === 'register'">
              <label class="block text-xs font-semibold mb-1.5 text-slate-600 dark:text-slate-300" x-text="lang === 'en' ? 'Full Name' : 'Nama Lengkap'"></label>
              <div class="relative">
                <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                <input type="text" x-model="authForm.name" placeholder="Rafli Ramadhani"
                       class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-emerald-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1.5 text-slate-600 dark:text-slate-300">Email</label>
              <div class="relative">
                <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                <input type="email" x-model="authForm.email" required placeholder="nama@email.com"
                       class="w-full pl-10 pr-4 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-emerald-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold mb-1.5 text-slate-600 dark:text-slate-300">Password</label>
              <div class="relative">
                <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                <input :type="showPassword ? 'text' : 'password'" x-model="authForm.password" required placeholder="••••••••"
                       class="w-full pl-10 pr-10 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-emerald-500" />
                <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 cursor-pointer">
                  <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <button type="submit" :disabled="authLoading"
                    class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2 transition cursor-pointer">
              <i :data-lucide="authTab === 'login' ? 'log-in' : 'user-plus'" class="w-4 h-4"></i>
              <span x-text="authTab === 'login' ? (lang === 'en' ? 'Sign In to Dashboard' : 'Masuk ke Dashboard') : (lang === 'en' ? 'Register & Enter' : 'Daftar & Masuk')"></span>
            </button>
          </form>

          <div class="relative my-5">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-800"></div></div>
            <div class="relative flex justify-center text-xs"><span class="px-2 bg-white dark:bg-slate-900 text-slate-400" x-text="lang === 'en' ? 'or quick access' : 'atau akses cepat'"></span></div>
          </div>

          <button type="button" @click="loginLocalGuest()"
                  class="w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold flex items-center justify-center gap-2 transition cursor-pointer">
            <i data-lucide="hard-drive" class="w-4 h-4 text-emerald-500"></i>
            <span x-text="lang === 'en' ? 'Continue with Local Storage Mode' : 'Masuk Mode Penyimpanan Lokal (Offline)'"></span>
          </button>
        </div>
      </div>
    </template>

    <!-- ===================================================================== -->
    <!-- 2. DASHBOARD UTAMA (HANYA MUNCUL SETELAH LOGIN BERHASIL)              -->
    <!-- ===================================================================== -->
    <template x-if="isAuthenticated">
      <div class="relative z-10 flex min-h-screen">
        <!-- Desktop Sidebar -->
        <aside class="hidden lg:flex lg:flex-col lg:w-64 border-r border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/75 backdrop-blur-xl p-5 justify-between sticky top-0 h-screen">
          <div>
            <!-- Brand Logo -->
            <div class="flex items-center justify-between mb-8">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                  <svg viewBox="0 0 24 24" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M8 13l3-3 2 2 3-4"/>
                  </svg>
                </div>
                <div>
                  <span class="font-extrabold text-lg tracking-tight block leading-none">FORTRE</span>
                  <span class="text-[11px] text-emerald-500 font-semibold">Wealth OS v2.6</span>
                </div>
              </div>
            </div>

            <!-- Navigation Menu -->
            <nav class="space-y-1.5">
              <button type="button" @click="switchTab('dashboard')"
                      :class="activeTab === 'dashboard' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'text-slate-600 dark:text-slate-400 border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl border text-sm font-semibold transition cursor-pointer">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                <span x-text="lang === 'en' ? 'Dashboard' : 'Ringkasan'"></span>
              </button>

              <button type="button" @click="switchTab('transactions')"
                      :class="activeTab === 'transactions' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'text-slate-600 dark:text-slate-400 border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl border text-sm font-semibold transition cursor-pointer">
                <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                <span x-text="lang === 'en' ? 'Transactions' : 'Transaksi'"></span>
              </button>

              <button type="button" @click="switchTab('budgets')"
                      :class="activeTab === 'budgets' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'text-slate-600 dark:text-slate-400 border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl border text-sm font-semibold transition cursor-pointer">
                <i data-lucide="pie-chart" class="w-4 h-4"></i>
                <span x-text="lang === 'en' ? 'Budgets & Goals' : 'Pagu & Target'"></span>
              </button>

              <button type="button" @click="switchTab('wealth')"
                      :class="activeTab === 'wealth' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'text-slate-600 dark:text-slate-400 border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl border text-sm font-semibold transition cursor-pointer">
                <i data-lucide="trending-up" class="w-4 h-4"></i>
                <span x-text="lang === 'en' ? 'Wealth & Simulators' : 'Kekayaan & Simulasi'"></span>
              </button>

              <button type="button" @click="switchTab('reports')"
                      :class="activeTab === 'reports' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30' : 'text-slate-600 dark:text-slate-400 border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60'"
                      class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl border text-sm font-semibold transition cursor-pointer">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                <span x-text="lang === 'en' ? 'Assistant & Export' : 'Asisten & Ekspor'"></span>
              </button>
            </nav>
          </div>

          <!-- User Profile & Logout -->
          <div class="space-y-3 pt-4 border-t border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-2.5 px-2">
              <div class="w-9 h-9 rounded-full bg-emerald-500/20 text-emerald-500 font-bold flex items-center justify-center text-sm" x-text="(currentUser?.name || 'U').charAt(0).toUpperCase()"></div>
              <div class="min-w-0 flex-1">
                <p class="text-xs font-bold truncate" x-text="currentUser?.name || 'Pengguna Fortre'"></p>
                <p class="text-[10px] text-slate-400 truncate" x-text="currentUser?.email || 'Mode Lokal'"></p>
              </div>
            </div>
            <button type="button" @click="logoutUser()"
                    class="w-full flex items-center justify-center gap-2 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 text-xs font-bold transition cursor-pointer">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
              <span x-text="lang === 'en' ? 'Sign Out' : 'Keluar (Logout)'"></span>
            </button>
          </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 pb-24 lg:pb-8">
          <!-- Top Header -->
          <header class="sticky top-0 z-30 bg-white/80 dark:bg-[#070B14]/80 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800/80 px-4 sm:px-6 py-3.5">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <!-- Mobile Logo + Connection Status -->
              <div class="flex items-center gap-3">
                <div class="lg:hidden w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow">
                  <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M8 13l3-3 2 2 3-4"/>
                  </svg>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h2 class="text-base sm:text-lg font-extrabold tracking-tight" x-text="pageTitle()"></h2>
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold"
                          :class="isOnline ? 'bg-emerald-500/15 text-emerald-500' : 'bg-amber-500/15 text-amber-500'">
                      <span class="w-1.5 h-1.5 rounded-full" :class="isOnline ? 'bg-emerald-500' : 'bg-amber-500'"></span>
                      <span x-text="isOnline ? 'Online' : 'Offline'"></span>
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400" x-text="activePeriodLabel()"></p>
                </div>
              </div>

              <!-- Global Controls -->
              <div class="flex items-center gap-2">
                <!-- Story Button -->
                <button type="button" @click="openStoryModal()"
                        class="relative p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"
                        title="Cerita Mingguan">
                  <i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i>
                  <span x-show="hasUnseenStory" class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                </button>

                <!-- Badges Button -->
                <button type="button" @click="isBadgeModalOpen = true; markBadgesSeen()"
                        class="relative p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"
                        title="Lencana Pencapaian">
                  <i data-lucide="award" class="w-4 h-4 text-indigo-500"></i>
                  <span x-show="hasNewBadge" class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                </button>

                <!-- Currency Selector -->
                <select x-model="currency" @change="localStorage.setItem('fortre_currency', currency)"
                        class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 cursor-pointer">
                  <option value="IDR">IDR</option>
                  <option value="USD">USD</option>
                  <option value="EUR">EUR</option>
                  <option value="SGD">SGD</option>
                </select>

                <!-- Language -->
                <button type="button" @click="toggleLang()"
                        class="px-2.5 py-1.5 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"
                        x-text="lang.toUpperCase()"></button>

                <!-- Dark Mode -->
                <button type="button" @click="toggleDarkMode()"
                        class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
                  <i :data-lucide="darkMode ? 'sun' : 'moon'" class="w-4 h-4"></i>
                </button>

                <!-- Add Transaction CTA -->
                <button type="button" @click="openAddModal()"
                        class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg shadow-emerald-600/20 cursor-pointer">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span class="hidden sm:inline" x-text="lang === 'en' ? 'New Entry' : 'Catat'"></span>
                </button>

                <!-- Mobile Logout -->
                <button type="button" @click="logoutUser()" class="lg:hidden p-2 rounded-xl bg-rose-500/10 text-rose-500 cursor-pointer" title="Logout">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </header>

          <!-- Main Body -->
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 pt-6 space-y-6">

            <!-- Period Filter Bar -->
            <div class="flex flex-wrap items-center justify-between gap-3 bg-white dark:bg-slate-900/75 border border-slate-200 dark:border-slate-800 rounded-2xl p-3">
              <div class="flex items-center gap-1.5">
                <button type="button" @click="periodMode = 'month'; refreshVisuals()"
                        :class="periodMode === 'month' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'"
                        class="px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">Bulanan</button>
                <button type="button" @click="periodMode = 'all'; refreshVisuals()"
                        :class="periodMode === 'all' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'"
                        class="px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">Semua Waktu</button>
              </div>
              <div class="flex items-center gap-2">
                <input type="month" x-model="selectedMonth" @change="periodMode = 'month'; refreshVisuals()"
                       class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
              </div>
            </div>

            <!-- =============================================================== -->
            <!-- TAB 1: DASHBOARD                                                -->
            <!-- =============================================================== -->
            <section x-show="activeTab === 'dashboard'" class="space-y-6">
              <!-- KPI Cards -->
              <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                <div class="p-5 rounded-3xl bg-gradient-to-br from-emerald-600 to-teal-700 text-white shadow-xl">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider opacity-85" x-text="t('headerCard.netBalanceTitle')"></span>
                    <i data-lucide="wallet" class="w-5 h-5 opacity-85"></i>
                  </div>
                  <p class="text-2xl font-extrabold font-mono mt-2" x-text="formatMoney(periodTotals.balance)"></p>
                  <p class="text-xs opacity-85 mt-2">Rasio Tabungan: <strong x-text="periodTotals.savingsRate + '%'"></strong></p>
                </div>

                <div class="p-5 rounded-3xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-500">Total Pemasukan</span>
                    <span class="p-2 rounded-xl bg-emerald-500/10 text-emerald-500"><i data-lucide="arrow-down-left" class="w-4 h-4"></i></span>
                  </div>

          <button type="button" @click="switchTab('budgets')" :class="activeTab === 'budgets' ? 'text-emerald-500' : 'text-slate-400'" class="flex flex-col items-center gap-1 text-[10px] font-bold cursor-pointer">
            <i data-lucide="pie-chart" class="w-4 h-4"></i><span>Anggaran</span>
          </button>
          <button type="button" @click="switchTab('reports')" :class="activeTab === 'reports' ? 'text-emerald-500' : 'text-slate-400'" class="flex flex-col items-center gap-1 text-[10px] font-bold cursor-pointer">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i><span>Laporan</span>
          </button>
        </nav>
      </div>
    </template>

    <!-- ===================================================================== -->
    <!-- MODAL: TAMBAH / EDIT TRANSAKSI + KALKULATOR KEYPAD                    -->
    <!-- ===================================================================== -->
    <div x-show="isAddModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div @click.outside="isAddModalOpen = false" class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold" x-text="editingTxId ? 'Edit Transaksi' : 'Catat Transaksi Baru'"></h3>
          <button type="button" @click="isAddModalOpen = false" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-800">
          <button type="button" @click="formTx.type = 'expense'" :class="formTx.type === 'expense' ? 'bg-rose-600 text-white' : 'text-slate-500'" class="py-2 rounded-lg text-xs font-bold cursor-pointer">Pengeluaran</button>
          <button type="button" @click="formTx.type = 'income'" :class="formTx.type === 'income' ? 'bg-emerald-600 text-white' : 'text-slate-500'" class="py-2 rounded-lg text-xs font-bold cursor-pointer">Pemasukan</button>
        </div>

        <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800/90 text-right">
          <p class="text-[11px] font-mono text-slate-400" x-text="amountExpr"></p>
          <p class="text-2xl font-extrabold font-mono text-emerald-500" x-text="formatMoney(evaluateKeypad())"></p>
        </div>

        <!-- Mini Keypad -->
        <div class="grid grid-cols-4 gap-1.5 text-xs font-bold font-mono">
          <template x-for="key in ['7','8','9','+','4','5','6','-','1','2','3','*','0','000','C','=']" :key="key">
            <button type="button" @click="pressKeypad(key)" class="py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-emerald-500/20 cursor-pointer" x-text="key"></button>
          </template>
        </div>

        <div class="space-y-2.5 text-xs">
          <input type="text" x-model="formTx.description" placeholder="Deskripsi transaksi (misal: Makan Siang)" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
          <div class="grid grid-cols-2 gap-2">
            <select x-model="formTx.category" class="px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
              <template x-for="c in (formTx.type === 'income' ? incomeCategories : expenseCategories)" :key="c">
                <option :value="c" x-text="c"></option>
              </template>
            </select>
            <select x-model="formTx.paymentMethod" class="px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
              <option value="Transfer Bank">Transfer Bank</option>
              <option value="E-Wallet / QRIS">E-Wallet / QRIS</option>
              <option value="Tunai">Tunai</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="date" x-model="formTx.date" class="px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
            <input type="text" x-model="formTx.purchaseLocation" placeholder="Lokasi (opsional)" class="px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
          </div>
        </div>

        <button type="button" @click="addTransaction()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg cursor-pointer">
          Simpan Transaksi
        </button>
      </div>

    <!-- ===================================================================== -->
    <!-- MODAL: CERITA FORTRE MINGGUAN                                         -->
    <!-- ===================================================================== -->
    <div x-show="isStoryModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
      <div @click.outside="isStoryModalOpen = false" class="w-full max-w-md bg-gradient-to-br from-slate-900 to-emerald-950 border border-emerald-500/30 text-white rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Cerita Arus Kas Mingguan</span>
          <button type="button" @click="isStoryModalOpen = false" class="p-1.5 rounded-lg bg-white/10 cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <template x-if="activeStory">
          <div class="space-y-3">
            <p class="text-xs text-slate-300" x-text="activeStory.rangeLabel"></p>
            <p class="text-2xl font-extrabold font-mono text-emerald-400" x-text="formatMoney(activeStory.netFlow)"></p>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="p-3 rounded-2xl bg-white/5">Pemasukan: <strong class="block text-emerald-400 mt-0.5" x-text="formatMoney(activeStory.income)"></strong></div>
              <div class="p-3 rounded-2xl bg-white/5">Pengeluaran: <strong class="block text-rose-400 mt-0.5" x-text="formatMoney(activeStory.expense)"></strong></div>
            </div>
            <p class="text-xs text-slate-200 leading-relaxed bg-white/5 p-3 rounded-2xl" x-text="activeStory.tip"></p>
          </div>

    <!-- ===================================================================== -->
    <!-- MODAL: LENCANA PENCAPAIAN                                             -->
    <!-- ===================================================================== -->
    <div x-show="isBadgeModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
      <div @click.outside="isBadgeModalOpen = false" class="w-full max-w-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold">Lencana Pencapaian Finansial</h3>
          <button type="button" @click="isBadgeModalOpen = false" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <template x-for="b in badgesList" :key="b.id">
            <div class="p-3.5 rounded-2xl border" :class="b.unlocked ? 'border-emerald-500/40 bg-emerald-500/5' : 'border-slate-200 dark:border-slate-800 opacity-60'">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center" :class="[b.bgClass, b.colorClass]" x-html="badgeIconSvg(b.icon)"></div>
                <div>
                  <p class="text-xs font-bold" x-text="lang === 'en' ? b.titleEn : b.titleId"></p>
                  <p class="text-[10px] text-slate-400" x-text="b.progress + '%'"></p>
                </div>
              </div>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-2" x-text="lang === 'en' ? b.descEn : b.descId"></p>
            </div>
          </template>
        </div>

  </div>

  <script>
    const SUPABASE_URL = '';
    const SUPABASE_ANON_KEY = '';
    const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    function fortreApp() {
      return {
        // AUTH STATE — Default FALSE agar langsung ke halaman Login
        isAuthenticated: false,
        authTab: 'login',
        authForm: { name: '', email: '', password: '' },
        authError: '',
        authLoading: false,
        showPassword: false,
        currentUser: null,

        // UI & APP STATE
        darkMode: true,
        lang: localStorage.getItem('fortre_lang') || 'id',
        currency: localStorage.getItem('fortre_currency') || 'IDR',
        activeTab: 'dashboard',
        isOnline: navigator.onLine,
        isSyncing: false,
        lastSyncTime: localStorage.getItem('fortre_last_sync') || '-',
        offlineQueue: JSON.parse(localStorage.getItem('fortre_offline_queue') || '[]'),
        toasts: [],

        // PERIOD & FILTER
        periodMode: 'month',
        selectedMonth: new Date().toISOString().slice(0, 7),
        selectedDate: new Date().toISOString().slice(0, 10),
        searchQuery: '',
        filterType: 'all',
        recentSearches: [],

        // MODALS
        isAddModalOpen: false,
        isStoryModalOpen: false,
        isBadgeModalOpen: false,
        showEmergencyWarning: false,
        showResetModal: false,
        selectedStoryWeekKey: null,

        // DATA
        targetSavingsRate: 20,
        expenseCategories: ['Makanan & Minuman', 'Transportasi', 'Tagihan & Utilitas', 'Belanja', 'Kesehatan', 'Hiburan', 'Lainnya'],
        incomeCategories: ['Gaji', 'Bonus & Insentif', 'Investasi', 'Freelance', 'Lainnya'],
        transactions: JSON.parse(localStorage.getItem('fortre_transactions') || '[]'),
        budgets: JSON.parse(localStorage.getItem('fortre_budgets') || '{"Makanan & Minuman":1500000,"Transportasi":800000,"Belanja":1000000}'),
        savingsGoals: JSON.parse(localStorage.getItem('fortre_goals') || '[{"id":"g-1","title":"Dana Darurat","targetAmount":10000000,"currentAmount":3500000}]'),
        assets: JSON.parse(localStorage.getItem('fortre_assets') || '[{"id":"a-1","name":"Rekening Utama","amount":12500000,"category":"Aset"}]'),
        liabilities: JSON.parse(localStorage.getItem('fortre_liabilities') || '[]'),
        debts: [],
        subscriptions: JSON.parse(localStorage.getItem('fortre_subs') || '[]'),
        seenStories: JSON.parse(localStorage.getItem('fortre_seen_stories') || '[]'),
        seenBadges: JSON.parse(localStorage.getItem('fortre_seen_badges') || '[]'),

        // FORMS
        editingTxId: null,
        amountExpr: '50000',
        formTx: {
          description: '',
          purchaseLocation: '',
          amount: 50000,
          type: 'expense',
          category: 'Makanan & Minuman',
          paymentMethod: 'Transfer Bank',
          date: new Date().toISOString().slice(0, 10)
        },
        budgetForm: { category: 'Makanan & Minuman', limit: 1500000 },
        goalForm: { title: '', targetAmount: 5000000 },
        wealthForm: { kind: 'asset', name: '', amount: 1000000 },
        subForm: { name: '', amount: 100000 },

        // COMPOUND SIMULATOR
        compoundMonthly: 1000000,
        compoundRate: 10,
        compoundYears: 5,

        // CHAT ASSISTANT
        chatInput: '',
        chatMessages: [
          { sender: 'assistant', text: 'Halo! Tanyakan ringkasan arus kas, rasio tabungan, atau kategori pengeluaran terbesar Anda.' }
        ],

        _charts: {},

        initApp() {
          // Restore session ONLY if user previously logged in
          const savedSession = localStorage.getItem('fortre_session');
          if (savedSession) {
            try {
              this.currentUser = JSON.parse(savedSession);
              this.isAuthenticated = true;
            } catch (e) {
              localStorage.removeItem('fortre_session');
              this.isAuthenticated = false;
            }
          }

          if (this.transactions.length === 0) {
            const today = new Date().toISOString().slice(0, 10);
            this.transactions = [
              { id: 'tx-init-1', description: 'Gaji Bulanan', purchaseLocation: 'Kantor', amount: 8500000, type: 'income', category: 'Gaji', paymentMethod: 'Transfer Bank', date: today },
              { id: 'tx-init-2', description: 'Belanja Kebutuhan Harian', purchaseLocation: 'Supermarket', amount: 450000, type: 'expense', category: 'Makanan & Minuman', paymentMethod: 'E-Wallet / QRIS', date: today },
              { id: 'tx-init-3', description: 'Transportasi & BBM', purchaseLocation: 'SPBU', amount: 200000, type: 'expense', category: 'Transportasi', paymentMethod: 'Tunai', date: today }
            ];
            this.persistAll();
          }

          // Auto-persist watchers
          this.$watch('transactions', () => this.persistAll());
          this.$watch('budgets', () => this.persistAll());
          this.$watch('savingsGoals', () => this.persistAll());
          this.$watch('assets', () => this.persistAll());
          this.$watch('liabilities', () => this.persistAll());
          this.$watch('isAuthenticated', (val) => {
            this.refreshIcons();
            if (val) this.refreshVisuals();
          });

          // MutationObserver agar ikon Lucide tidak pernah hilang saat DOM berubah
          const observer = new MutationObserver(() => {
            if (window.lucide) window.lucide.createIcons();
          });
          observer.observe(document.getElementById('app-root'), { childList: true, subtree: true });

          this.initDotMatrix();
          this.refreshIcons();
          if (this.isAuthenticated) {
            this.refreshVisuals();
          }
        },

        persistAll() {
          localStorage.setItem('fortre_transactions', JSON.stringify(this.transactions));
          localStorage.setItem('fortre_budgets', JSON.stringify(this.budgets));
          localStorage.setItem('fortre_goals', JSON.stringify(this.savingsGoals));
          localStorage.setItem('fortre_assets', JSON.stringify(this.assets));
          localStorage.setItem('fortre_liabilities', JSON.stringify(this.liabilities));
        },

        refreshIcons() {
          this.$nextTick(() => {
            if (window.lucide) window.lucide.createIcons();
          });
        },

        refreshVisuals() {
          this.$nextTick(() => {
            this.refreshIcons();
            this.renderCharts();
            if (this.activeTab === 'wealth') this.renderCompoundChart();
          });
        },

        // AUTH METHODS
        async handleLogin() {
          this.authError = '';
          const email = (this.authForm.email || '').trim().toLowerCase();
          const password = this.authForm.password || '';
          if (!email || password.length < 4) {
            this.authError = this.lang === 'en' ? 'Enter a valid email and password (min 4 chars).' : 'Masukkan email valid dan password minimal 4 karakter.';
            return;
          }

          this.authLoading = true;
          try {
            if (supabaseClient) {
              const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
              if (error) throw error;
              this.currentUser = { id: data.user.id, email: data.user.email, name: data.user.user_metadata?.name || email.split('@')[0] };
            } else {
              const users = JSON.parse(localStorage.getItem('fortre_users') || '[]');
              const found = users.find(u => u.email === email);
              if (found && found.password !== password) {
                throw new Error(this.lang === 'en' ? 'Incorrect password.' : 'Password salah.');
              }
              this.currentUser = {
                id: found ? found.id : 'local-' + Date.now(),
                email,
                name: found ? found.name : email.split('@')[0]
              };
            }

            localStorage.setItem('fortre_session', JSON.stringify(this.currentUser));
            this.isAuthenticated = true;
            this.pushToast('Berhasil Masuk', `Selamat datang kembali, ${this.currentUser.name}!`, 'success');
          } catch (err) {
            this.authError = err.message || 'Gagal login.';
          } finally {
            this.authLoading = false;
          }
        },

        async handleRegister() {
          this.authError = '';
          const name = (this.authForm.name || '').trim() || 'Pengguna Fortre';
          const email = (this.authForm.email || '').trim().toLowerCase();
          const password = this.authForm.password || '';
          if (!email || password.length < 4) {
            this.authError = 'Lengkapi nama, email, dan password minimal 4 karakter.';
            return;
          }

          this.authLoading = true;
          try {
            if (supabaseClient) {
              const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { name } }
              });
              if (error) throw error;
              this.currentUser = { id: data.user?.id || ('sb-' + Date.now()), email, name };
            } else {
              const users = JSON.parse(localStorage.getItem('fortre_users') || '[]');
              if (users.some(u => u.email === email)) {
                throw new Error('Email sudah terdaftar. Silakan gunakan tab Masuk Akun.');
              }
              const newUser = { id: 'usr-' + Date.now(), name, email, password };
              users.push(newUser);
              localStorage.setItem('fortre_users', JSON.stringify(users));
              this.currentUser = { id: newUser.id, name, email };
            }

            localStorage.setItem('fortre_session', JSON.stringify(this.currentUser));
            this.isAuthenticated = true;
            this.pushToast('Akun Terdaftar', `Selamat datang di Fortre, ${name}!`, 'success');
          } catch (err) {
            this.authError = err.message || 'Gagal mendaftar.';
          } finally {
            this.authLoading = false;
          }
        },

        loginLocalGuest() {
          this.currentUser = { id: 'local-guest', name: 'Rafli Ramadhani', email: 'lokal@fortre.app' };
          localStorage.setItem('fortre_session', JSON.stringify(this.currentUser));
          this.isAuthenticated = true;
          this.pushToast('Mode Lokal Aktif', 'Data tersimpan aman di perangkat Anda.', 'success');
        },

        async logoutUser() {
          if (supabaseClient) {
            try { await supabaseClient.auth.signOut(); } catch (e) {}
          }
          localStorage.removeItem('fortre_session');
          this.currentUser = null;
          this.isAuthenticated = false;
          this.activeTab = 'dashboard';
          this.authForm.password = '';
          this.refreshIcons();
        },

        isCloudUser() {
          return Boolean(supabaseClient && this.currentUser && !String(this.currentUser.id).startsWith('local'));
        },

        switchTab(tab) {
          this.activeTab = tab;
          this.refreshVisuals();
        },

        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          document.documentElement.classList.toggle('dark', this.darkMode);
          this.refreshVisuals();
        },

        toggleLang() {
          this.lang = this.lang === 'id' ? 'en' : 'id';
          localStorage.setItem('fortre_lang', this.lang);
          this.refreshVisuals();
        },

        t(key) {
          const dict = {
            'headerCard.netBalanceTitle': this.lang === 'en' ? 'Net Balance' : 'Saldo Bersih'
          };
          return dict[key] || key;
        },

        pageTitle() {
          const titles = {
            dashboard: this.lang === 'en' ? 'Financial Overview' : 'Ringkasan Keuangan',
            transactions: this.lang === 'en' ? 'Transactions' : 'Riwayat Transaksi',
            budgets: this.lang === 'en' ? 'Budgets & Goals' : 'Pagu & Target Tabungan',
            wealth: this.lang === 'en' ? 'Net Worth & Simulators' : 'Kekayaan & Simulasi',
            reports: this.lang === 'en' ? 'Assistant & Reports' : 'Asisten & Laporan'
          };
          return titles[this.activeTab] || 'Fortre';
        },

        activePeriodLabel() {
          return this.periodMode === 'all' ? 'Semua Waktu' : `Periode ${this.selectedMonth}`;
        },

        pushToast(title, message, type = 'success') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, title, message, type });
          this.refreshIcons();
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
          }, 3500);
        },

        // COMPUTED DATA
        get periodTransactions() {
          if (this.periodMode === 'all') return this.transactions;
          return this.transactions.filter(t => (t.date || '').startsWith(this.selectedMonth));
        },

        get filteredTransactions() {
          const q = this.searchQuery.toLowerCase().trim();
          return this.periodTransactions.filter(t => {
            const matchType = this.filterType === 'all' || t.type === this.filterType;
            const matchQ = !q ||
              (t.description || '').toLowerCase().includes(q) ||
              (t.category || '').toLowerCase().includes(q) ||
              (t.purchaseLocation || '').toLowerCase().includes(q);
            return matchType && matchQ;
          });
        },

        get periodTotals() {
          let totalIncome = 0;
          let totalExpense = 0;
          this.periodTransactions.forEach(t => {
            const amt = Number(t.amount) || 0;
            if (t.type === 'income') totalIncome += amt;
            else totalExpense += amt;
          });
          const balance = totalIncome - totalExpense;
          const savingsRate = totalIncome > 0 ? Math.max(0, Math.round((balance / totalIncome) * 100)) : 0;
          return { totalIncome, totalExpense, balance, savingsRate };
        },

        get walletBalances() {
          const wallets = [
            { name: 'Transfer Bank', icon: 'landmark', balance: 0 },
            { name: 'E-Wallet / QRIS', icon: 'qr-code', balance: 0 },
            { name: 'Tunai', icon: 'banknote', balance: 0 }
          ];
          this.transactions.forEach(t => {
            const w = wallets.find(x => x.name === t.paymentMethod) || wallets[0];
            const amt = Number(t.amount) || 0;
            w.balance += t.type === 'income' ? amt : -amt;
          });
          return wallets;
        },

        get expenseAllocationItems() {
          const map = {};
          let sum = 0;
          this.periodTransactions.filter(t => t.type === 'expense').forEach(t => {
            const amt = Number(t.amount) || 0;
            map[t.category] = (map[t.category] || 0) + amt;
            sum += amt;
          });
          return Object.entries(map)
            .sort((a, b) => b[1] - a[1])
            .map(([category, amount]) => ({
              category,
              amount,
              pct: sum > 0 ? Math.round((amount / sum) * 100) : 0
            }));
        },

        get budgetStatuses() {
          const spentMap = {};
          this.periodTransactions.filter(t => t.type === 'expense').forEach(t => {
            spentMap[t.category] = (spentMap[t.category] || 0) + (Number(t.amount) || 0);
          });
          let exceededCount = 0;
          const items = Object.entries(this.budgets).map(([category, limit]) => {
            const spent = spentMap[category] || 0;
            const pct = limit > 0 ? Math.round((spent / limit) * 100) : 0;
            const exceeded = spent > limit;
            if (exceeded) exceededCount++;
            return { category, limit, spent, pct, exceeded };
          });
          return { items, exceededCount };
        },

        get financialHealth() {
          const rate = this.periodTotals.savingsRate;
          let score = 50 + Math.min(35, rate);
          if (this.budgetStatuses.exceededCount === 0) score += 15;
          score = Math.min(100, Math.max(10, score));
          const label = score >= 80 ? 'Prima' : (score >= 60 ? 'Sehat' : 'Perlu Evaluasi');
          return { score, label };
        },

        get netWorthData() {
          const totalAssets = this.assets.reduce((s, a) => s + (Number(a.amount) || 0), 0) + Math.max(0, this.periodTotals.balance);
          const totalLiabilities = this.liabilities.reduce((s, l) => s + (Number(l.amount) || 0), 0);
          return { totalAssets, totalLiabilities, netWorth: totalAssets - totalLiabilities };
        },

        // KEYPAD CALCULATOR
        pressKeypad(key) {
          if (key === 'C') {
            this.amountExpr = '0';
          } else if (key === '=') {
            this.amountExpr = String(this.evaluateKeypad());
          } else {
            this.amountExpr = this.amountExpr === '0' ? key : this.amountExpr + key;
          }
        },

        evaluateKeypad() {
          try {
            const sanitized = String(this.amountExpr).replace(/[^0-9+\-*/.]/g, '');
            if (!sanitized) return 0;
            const val = Function('"use strict";return (' + sanitized + ')')();
            return Number.isFinite(val) ? Math.max(0, Math.round(val)) : 0;
          } catch (e) {
            return 0;
          }
        },

        // WEEKLY STORIES & BADGES
        isCeritaActive() {
          return true;
        },

        nextSundayIso() {
          const now = new Date();
          const diff = (7 - now.getDay()) % 7 || 7;
          now.setDate(now.getDate() + diff);
          return now.toISOString().slice(0, 10);
        },

        get weeklyStories() {
          const { totalIncome, totalExpense, balance, savingsRate } = this.periodTotals;
          const topCat = this.expenseAllocationItems[0]?.category || 'Belum ada';
          return [{
            weekKey: this.selectedMonth,
            rangeLabel: this.activePeriodLabel(),
            income: totalIncome,
            expense: totalExpense,
            netFlow: balance,
            topCat,
            savingsRate,
            tip: balance >= 0
              ? `Arus kas surplus dengan rasio tabungan ${savingsRate}%. Pertahankan disiplin alokasi dana!`
              : `Pengeluaran melampaui pemasukan, terbesar pada kategori ${topCat}.`
          }];
        },

        get activeStory() {
          return this.weeklyStories[0] || null;
        },

        get hasUnseenStory() {
          const latest = this.weeklyStories[0];
          return Boolean(latest && !this.seenStories.includes(latest.weekKey));
        },

        openStoryModal() {
          if (this.activeStory && !this.seenStories.includes(this.activeStory.weekKey)) {
            this.seenStories.push(this.activeStory.weekKey);
            localStorage.setItem('fortre_seen_stories', JSON.stringify(this.seenStories));
          }
          this.isStoryModalOpen = true;
          this.refreshIcons();
        },

        get badgesList() {
          const txCount = this.transactions.length;
          const rateOk = this.periodTotals.savingsRate >= this.targetSavingsRate && this.periodTotals.totalIncome > 0;
          const budgetOk = this.budgetStatuses.exceededCount === 0 && txCount > 0;
          const goalHalf = this.savingsGoals.some(g => g.targetAmount > 0 && g.currentAmount >= g.targetAmount * 0.5);
          const hasAssets = this.netWorthData.totalAssets > 0;

          return [
            { id: 'first-tx', icon: 'award', titleId: 'Langkah Pertama', titleEn: 'First Step', descId: 'Mencatat transaksi pertama di Fortre.', descEn: 'Recorded your first transaction.', progress: txCount >= 1 ? 100 : 0, unlocked: txCount >= 1, colorClass: 'text-emerald-500', bgClass: 'bg-emerald-500/15' },
            { id: 'saver-pro', icon: 'piggy-bank', titleId: 'Disiplin Menabung', titleEn: 'Savings Master', descId: `Rasio tabungan minimal ${this.targetSavingsRate}%.`, descEn: `Reached ${this.targetSavingsRate}% savings rate.`, progress: rateOk ? 100 : 50, unlocked: rateOk, colorClass: 'text-indigo-500', bgClass: 'bg-indigo-500/15' },
            { id: 'budget-guard', icon: 'shield-check', titleId: 'Penjaga Pagu', titleEn: 'Budget Guardian', descId: 'Semua kategori di bawah batas pagu.', descEn: 'All categories within budget.', progress: budgetOk ? 100 : 40, unlocked: budgetOk, colorClass: 'text-sky-500', bgClass: 'bg-sky-500/15' },
            { id: 'goal-builder', icon: 'target', titleId: 'Pemburu Target', titleEn: 'Goal Builder', descId: 'Target tabungan mencapai 50%.', descEn: 'Savings goal reached 50%.', progress: goalHalf ? 100 : 35, unlocked: goalHalf, colorClass: 'text-amber-500', bgClass: 'bg-amber-500/15' },
            { id: 'wealth-tracker', icon: 'gem', titleId: 'Arsitek Kekayaan', titleEn: 'Wealth Architect', descId: 'Mencatat portofolio aset & kekayaan bersih.', descEn: 'Tracked net worth assets.', progress: hasAssets ? 100 : 0, unlocked: hasAssets, colorClass: 'text-purple-500', bgClass: 'bg-purple-500/15' },
            { id: 'tx-streak', icon: 'flame', titleId: 'Pencatat Aktif', titleEn: 'Active Tracker', descId: 'Konsisten mencatat minimal 5 transaksi.', descEn: 'Logged at least 5 transactions.', progress: Math.min(100, Math.round((txCount / 5) * 100)), unlocked: txCount >= 5, colorClass: 'text-rose-500', bgClass: 'bg-rose-500/15' }
          ];
        },

        get unlockedBadges() {
          return this.badgesList.filter(b => b.unlocked);
        },

        get hasNewBadge() {
          return this.unlockedBadges.some(b => !this.seenBadges.includes(b.id));
        },

        markBadgesSeen() {
          const ids = this.unlockedBadges.map(b => b.id);
          this.seenBadges = Array.from(new Set([...this.seenBadges, ...ids]));
          localStorage.setItem('fortre_seen_badges', JSON.stringify(this.seenBadges));
        },

        badgeIconSvg(icon, sizeClass = 'w-4 h-4') {
          const map = {
            'award': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>`,
            'piggy-bank': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/></svg>`,
            'shield-check': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>`,
            'target': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
            'gem': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M2 9h20"/></svg>`,
            'flame': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`
          };
          return map[icon] || map['award'];
        },

        walletIconSvg(icon, sizeClass = 'w-4 h-4') {
          const map = {
            'landmark': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>`,
            'qr-code': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg>`,
            'banknote': `<svg viewBox="0 0 24 24" class="${sizeClass}" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/></svg>`
          };
          return map[icon] || map['banknote'];
        },

        formatMoney(amount) {
          const val = Number(amount) || 0;
          const rates = { IDR: 1, USD: 1 / 16000, EUR: 1 / 17400, SGD: 1 / 11900 };
          const locales = { IDR: 'id-ID', USD: 'en-US', EUR: 'de-DE', SGD: 'en-SG' };
          const converted = val * (rates[this.currency] || 1);
          const digits = this.currency === 'IDR' ? 0 : 2;
          return new Intl.NumberFormat(locales[this.currency] || 'id-ID', {
            style: 'currency',
            currency: this.currency,
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
          }).format(converted);
        },

        get compoundProjectedTotal() {
          const p = Number(this.compoundMonthly) || 0;
          const r = (Number(this.compoundRate) || 0) / 100 / 12;
          const n = (Number(this.compoundYears) || 1) * 12;
          if (r === 0) return p * n;
          return Math.round(p * ((Math.pow(1 + r, n) - 1) / r));
        },

        // CHARTS
        _destroyChart(key) {
          if (this._charts[key]) {
            this._charts[key].destroy();
            delete this._charts[key];
          }
        },

        renderCharts() {
          if (!window.Chart) return;
          const textColor = this.darkMode ? '#94a3b8' : '#475569';
          const gridColor = this.darkMode ? 'rgba(148,163,184,0.12)' : 'rgba(15,23,42,0.08)';

          const trendCanvas = document.getElementById('trendChart');
          if (trendCanvas) {
            this._destroyChart('trendChart');
            const sorted = [...this.periodTransactions].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            const labels = sorted.length ? sorted.map(t => t.date.slice(5)) : ['01', '02'];
            let running = 0;
            const series = sorted.length
              ? sorted.map(t => {
                  running += t.type === 'income' ? Number(t.amount) : -Number(t.amount);
                  return running;
                })
              : [0, 0];

            this._charts.trendChart = new Chart(trendCanvas, {
              type: 'line',
              data: {
                labels,
                datasets: [{
                  label: 'Saldo Berjalan',
                  data: series,
                  borderColor: '#10B981',
                  backgroundColor: 'rgba(16, 185, 129, 0.16)',
                  fill: true,
                  tension: 0.35,
                  pointRadius: 3
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } },
                  y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
                }
              }
            });
          }

          const donutCanvas = document.getElementById('donutChart');
          if (donutCanvas) {
            this._destroyChart('donutChart');
            const items = this.expenseAllocationItems;
            this._charts.donutChart = new Chart(donutCanvas, {
              type: 'doughnut',
              data: {
                labels: items.length ? items.map(i => i.category) : ['Belum ada'],
                datasets: [{
                  data: items.length ? items.map(i => i.amount) : [1],
                  backgroundColor: items.length
                    ? ['#10B981', '#6366F1', '#F59E0B', '#EC4899', '#14B8A6', '#8B5CF6']
                    : ['#334155'],
                  borderWidth: 0
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '68%',
                plugins: {
                  legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, font: { size: 10 } } }
                }
              }
            });
          }
        },

        renderCompoundChart() {
          const canvas = document.getElementById('compoundChart');
          if (!canvas || !window.Chart) return;
          this._destroyChart('compoundChart');
          const p = Number(this.compoundMonthly) || 0;
          const r = (Number(this.compoundRate) || 0) / 100 / 12;
          const yrs = Number(this.compoundYears) || 1;
          const labels = [];
          const principal = [];
          const total = [];
          for (let y = 1; y <= yrs; y++) {
            const n = y * 12;
            labels.push(`Thn ${y}`);
            principal.push(p * n);
            total.push(r === 0 ? p * n : Math.round(p * ((Math.pow(1 + r, n) - 1) / r)));
          }
          const textColor = this.darkMode ? '#94a3b8' : '#475569';
          this._charts.compoundChart = new Chart(canvas, {
            type: 'line',
            data: {
              labels,
              datasets: [
                { label: 'Nilai Akhir', data: total, borderColor: '#10B981', backgroundColor: 'rgba(16,185,129,0.15)', fill: true, tension: 0.3 },
                { label: 'Pokok', data: principal, borderColor: '#6366F1', borderDash: [4, 4], tension: 0.3 }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: textColor, font: { size: 10 } } } },
              scales: {
                x: { ticks: { color: textColor, font: { size: 9 } }, grid: { display: false } },
                y: { ticks: { color: textColor, font: { size: 9 } } }
              }
            }
          });
        },

        // CRUD TRANSACTIONS, BUDGETS, GOALS, WEALTH
        openAddModal() {
          this.editingTxId = null;
          this.formTx = {
            description: '',
            purchaseLocation: '',
            amount: 50000,
            type: 'expense',
            category: 'Makanan & Minuman',
            paymentMethod: 'Transfer Bank',
            date: new Date().toISOString().slice(0, 10)
          };
          this.amountExpr = '50000';
          this.isAddModalOpen = true;
          this.refreshIcons();
        },

        startEditTransaction(tx) {
          this.editingTxId = tx.id;
          this.formTx = { ...tx };
          this.amountExpr = String(tx.amount || 0);
          this.isAddModalOpen = true;
          this.refreshIcons();
        },

        addTransaction() {
          const evaluated = Number(this.evaluateKeypad()) || 0;
          if (evaluated <= 0) {
            this.pushToast('Nominal Tidak Valid', 'Masukkan nominal lebih dari 0.', 'warning');
            return;
          }
          const payload = {
            id: this.editingTxId || ('tx-' + Date.now()),
            description: (this.formTx.description || '').trim() || this.formTx.category,
            purchaseLocation: (this.formTx.purchaseLocation || '').trim(),
            amount: evaluated,
            type: this.formTx.type,
            category: this.formTx.category,
            paymentMethod: this.formTx.paymentMethod,
            date: this.formTx.date
          };
          if (this.editingTxId) {
            const idx = this.transactions.findIndex(t => t.id === this.editingTxId);
            if (idx !== -1) this.transactions.splice(idx, 1, payload);
          } else {
            this.transactions.unshift(payload);
          }
          this.editingTxId = null;
          this.isAddModalOpen = false;
          this.pushToast('Tersimpan', `${payload.description} (${this.formatMoney(payload.amount)}) berhasil disimpan.`, 'success');
          this.refreshVisuals();
        },

        deleteTransaction(id) {
          this.transactions = this.transactions.filter(t => t.id !== id);
          this.pushToast('Dihapus', 'Transaksi berhasil dihapus.', 'warning');
          this.refreshVisuals();
        },

        addRecentSearch(q) {
          if (q && !this.recentSearches.includes(q)) this.recentSearches.unshift(q);
        },

        saveBudgetLimit() {
          if (!this.budgetForm.category || this.budgetForm.limit <= 0) return;
          this.budgets = { ...this.budgets, [this.budgetForm.category]: Number(this.budgetForm.limit) };
          this.pushToast('Pagu Diperbarui', `Batas ${this.budgetForm.category} disimpan.`, 'success');
        },

        addSavingsGoal() {
          if (!this.goalForm.title || this.goalForm.targetAmount <= 0) return;
          this.savingsGoals.push({ id: 'g-' + Date.now(), title: this.goalForm.title, targetAmount: Number(this.goalForm.targetAmount), currentAmount: 0 });
          this.goalForm.title = '';
          this.pushToast('Target Dibuat', 'Target tabungan baru ditambahkan.', 'success');
        },

        depositGoal(id, amount) {
          const g = this.savingsGoals.find(x => x.id === id);
          if (g) {
            g.currentAmount += amount;
            this.persistAll();
            this.pushToast('Setoran Masuk', `+${this.formatMoney(amount)} ke ${g.title}.`, 'success');
          }
        },

        deleteGoal(id) {
          this.savingsGoals = this.savingsGoals.filter(g => g.id !== id);
        },

        addWealthItem() {
          if (!this.wealthForm.name || this.wealthForm.amount <= 0) return;
          const item = { id: 'w-' + Date.now(), name: this.wealthForm.name, amount: Number(this.wealthForm.amount) };
          if (this.wealthForm.kind === 'asset') this.assets.push(item);
          else this.liabilities.push(item);
          this.wealthForm.name = '';
          this.pushToast('Kekayaan Diperbarui', `${item.name} berhasil ditambahkan.`, 'success');
        },

        // EXPORTS & CHAT
        _triggerBlobDownload(blob, filename) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1500);
        },

        async downloadJPG() {
          if (!window.html2canvas) return;
          const canvas = await html2canvas(document.querySelector('main') || document.body, { backgroundColor: this.darkMode ? '#070B14' : '#F8FAFC', scale: 2 });
          canvas.toBlob(blob => { if (blob) this._triggerBlobDownload(blob, `Fortre-${this.activePeriodLabel()}.jpg`); }, 'image/jpeg', 0.92);
          this.pushToast('Ekspor JPG', 'Gambar laporan berhasil diunduh.', 'success');
        },

        downloadWord() {
          const rows = this.periodTransactions.map(t => `<tr><td>${t.date}</td><td>${t.description}</td><td>${t.category}</td><td>${this.formatMoney(t.amount)}</td></tr>`).join('');
          const html = `<html><head><meta charset="utf-8"></head><body><h2>Fortre Report</h2><table border="1" cellpadding="6"><tr><th>Tanggal</th><th>Deskripsi</th><th>Kategori</th><th>Nominal</th></tr>${rows}</table></body></html>`;
          this._triggerBlobDownload(new Blob(['\ufeff', html], { type: 'application/msword' }), `Fortre-${this.activePeriodLabel()}.doc`);
          this.pushToast('Ekspor Word', 'Dokumen Word berhasil diunduh.', 'success');
        },

        downloadCSV() {
          const header = ['Tanggal', 'Deskripsi', 'Tipe', 'Kategori', 'Metode', 'Nominal'];
          const lines = this.periodTransactions.map(t => [t.date, `"${t.description}"`, t.type, t.category, t.paymentMethod, t.amount].join(','));
          this._triggerBlobDownload(new Blob(['\ufeff' + [header.join(','), ...lines].join('\n')], { type: 'text/csv;charset=utf-8;' }), `Fortre-${this.activePeriodLabel()}.csv`);
          this.pushToast('Ekspor CSV', 'File CSV berhasil diunduh.', 'success');
        },

        downloadExcel() {
          if (!window.XLSX) return;
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(this.periodTransactions), 'Transaksi');
          XLSX.writeFile(wb, `Fortre-${this.activePeriodLabel()}.xlsx`);
          this.pushToast('Ekspor Excel', 'Workbook Excel berhasil diunduh.', 'success');
        },

        downloadPDF() {
          if (!window.jspdf) return;
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFontSize(14);
          doc.text(`Fortre Financial Report (${this.activePeriodLabel()})`, 14, 18);
          doc.setFontSize(10);
          doc.text(`Pemasukan: ${this.formatMoney(this.periodTotals.totalIncome)} | Pengeluaran: ${this.formatMoney(this.periodTotals.totalExpense)}`, 14, 28);
          let y = 40;
          this.periodTransactions.slice(0, 30).forEach(t => {
            doc.text(`${t.date} - ${t.description} (${t.category}): ${this.formatMoney(t.amount)}`, 14, y);
            y += 6;
          });
          doc.save(`Fortre-${this.activePeriodLabel()}.pdf`);
          this.pushToast('Ekspor PDF', 'Dokumen PDF berhasil diunduh.', 'success');
        },

        downloadStandaloneHtml() {
          this._triggerBlobDownload(new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML], { type: 'text/html;charset=utf-8;' }), 'Fortre-Offline.html');
          this.pushToast('HTML Diunduh', 'Aplikasi standalone offline berhasil diunduh.', 'success');
        },

        forceBackupJSON() {
          const data = { exportedAt: new Date().toISOString(), transactions: this.transactions, budgets: this.budgets, savingsGoals: this.savingsGoals, assets: this.assets, liabilities: this.liabilities };
          this._triggerBlobDownload(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'fortre-backup.json');
          this.pushToast('Backup JSON', 'Cadangan JSON berhasil diunduh.', 'success');
        },

        resetAllData() {
          this.transactions = [];
          this.savingsGoals = [];
          this.assets = [];
          this.liabilities = [];
          this.persistAll();
          this.refreshVisuals();
          this.pushToast('Data Direset', 'Semua data transaksi dikosongkan.', 'warning');
        },

        sendChat() {
          const q = (this.chatInput || '').trim();
          if (!q) return;
          this.chatMessages.push({ sender: 'user', text: q });
          this.chatInput = '';
          const { totalIncome, totalExpense, balance, savingsRate } = this.periodTotals;
          const top = this.expenseAllocationItems[0];
          this.chatMessages.push({
            sender: 'assistant',
            text: `Ringkasan ${this.activePeriodLabel()}: Pemasukan ${this.formatMoney(totalIncome)}, Pengeluaran ${this.formatMoney(totalExpense)}, Saldo Bersih ${this.formatMoney(balance)} (rasio tabungan ${savingsRate}%).${top ? ` Pengeluaran terbesar pada ${top.category} (${top.pct}%).` : ''}`
          });
        },

        initDotMatrix() {
          window.addEventListener('online', () => { this.isOnline = true; });
          window.addEventListener('offline', () => { this.isOnline = false; });

          const canvas = document.getElementById('dotMatrixCanvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let w = (canvas.width = window.innerWidth);
          let h = (canvas.height = window.innerHeight);

          window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          });

          let tick = 0;
          const draw = () => {
            ctx.clearRect(0, 0, w, h);
            const spacing = 28;
            ctx.fillStyle = this.darkMode ? 'rgba(16, 185, 129, 0.22)' : 'rgba(15, 23, 42, 0.14)';
            for (let x = spacing / 2; x < w; x += spacing) {
              for (let y = spacing / 2; y < h; y += spacing) {
                const r = 1.1 + Math.sin((x + y) * 0.015 + tick) * 0.45;
                ctx.beginPath();
                ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2);
                ctx.fill();
              }
            }
            tick += 0.025;
            requestAnimationFrame(draw);
          };
          draw();
        }
      };
    }
  </script>
