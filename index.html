<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fortre" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 240'%3E%3Cpath d='M34 71V39l22-7v13.5L80 38V24.5L100 18l20 6.5V38l24 7.5V32l22 7v79c0 46-28 80-66 102-38-22-66-56-66-102V71z' fill='%230F172A' stroke='%23E8C68E' stroke-width='10'/%3E%3Ctext x='100' y='145' text-anchor='middle' fill='%23E8C68E' font-size='88' font-family='sans-serif' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E" />
  <title>Fortre - Money Tracker & Budget Manager</title>
  <meta name="description" content="Fortre - Money Tracker & Budget Manager with authentication gate, adaptive desktop glassmorphic dashboard & mobile fintech UI, multi-currency, QRIS scanner, and cloud/localStorage sync." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fortre: {
              navy: '#0F172A',
              emerald: '#10B981',
              ruby: '#EF4444',
              mint: '#34D399',
              dark: '#0B1120'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- Supabase JS SDK v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SheetJS / XLSX CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- jsPDF CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <!-- html2canvas CDN -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .tabular-nums {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes navPop {
      0% { transform: scale(0.92); }
      55% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .animate-nav-pop { animation: navPop 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes logoSheen {
      0% { transform: translateX(-160%) skewX(-22deg); opacity: 0; }
      20% { opacity: 0.72; }
      55% { transform: translateX(220%) skewX(-22deg); opacity: 0; }
      100% { transform: translateX(220%) skewX(-22deg); opacity: 0; }
    }
    .fortre-logo-gloss {
      position: relative;
      overflow: hidden;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.24));
    }
    .dark .fortre-logo-gloss {
      filter: drop-shadow(0 4px 14px rgba(229, 193, 88, 0.32));
    }
    .fortre-logo-gloss::after {
      content: '';
      position: absolute;
      inset: -15% 0;
      width: 44%;
      background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.68) 50%, transparent 80%);
      animation: logoSheen 4.8s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }
    .fortre-date-input::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.72;
      margin-left: 1px;
    }
    .dark .fortre-date-input::-webkit-calendar-picker-indicator {
      filter: invert(0.92);
    }
    .story-ring-unread {
      background: conic-gradient(from 195deg, #10b981, #14b8a6, #e5c158, #f59e0b, #10b981);
      padding: 2px;
      border-radius: 9999px;
    }
    .story-ring-seen {
      background: rgba(148, 163, 184, 0.45);
      padding: 2px;
      border-radius: 9999px;
    }
    .safe-bottom-nav { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    .safe-top-header { padding-top: max(0.75rem, env(safe-area-inset-top)); }
    @keyframes bottomSheetUp {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 767px) {
      .mobile-bottom-sheet { animation: bottomSheetUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mobile-bottom-sheet, .animate-nav-pop, .fortre-logo-gloss::after { animation: none !important; transition: none !important; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.35); border-radius: 9999px; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-[#0B1120] text-slate-800 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white"
      x-data="fortreApp()"
      x-init="initApp()">

  <!-- CANVAS DYNAMIC DOT MATRIX ANIMATION -->
  <canvas id="dotMatrixCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-45"></canvas>

  <!-- =================================================================== -->
  <!-- AUTHENTICATION GATE (LOGIN / SIGN-UP / FORGOT PASSWORD / DEMO MODE) -->
  <!-- =================================================================== -->
  <div x-show="!currentUser" x-cloak class="relative z-10 min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md flex items-center justify-end gap-2 mb-4">
      <button @click="toggleTheme()" :aria-label="darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'" class="w-10 h-10 rounded-xl bg-white/90 dark:bg-[#0F172A]/90 border border-slate-200 dark:border-slate-800 flex items-center justify-center shadow-sm cursor-pointer transition-transform active:scale-95">
        <span x-show="darkMode"><i data-lucide="sun" class="w-4 h-4 text-amber-400"></i></span>
        <span x-show="!darkMode"><i data-lucide="moon" class="w-4 h-4 text-indigo-600"></i></span>
      </button>
    </div>

    <div class="w-full max-w-md rounded-2xl bg-white/92 dark:bg-[#0F172A]/92 backdrop-blur-2xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden">
      <div class="h-1.5 w-full bg-gradient-to-r from-indigo-500 via-emerald-500 to-teal-500"></div>
      <div class="p-6 sm:p-8 space-y-5">
        <div class="flex flex-col items-center text-center space-y-2">
          <div class="w-20 h-20 fortre-logo-gloss flex items-center justify-center">
            <svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full object-contain relative z-[1]" aria-label="Fortre Emblem">
              <defs>
                <clipPath id="fortreLeftHalf"><rect x="0" y="0" width="100" height="240"/></clipPath>
                <clipPath id="fortreRightHalf"><rect x="100" y="0" width="100" height="240"/></clipPath>
                <mask id="fortreDollarMask">
                  <rect x="0" y="0" width="200" height="240" fill="white"/>
                  <rect x="74" y="68" width="52" height="104" rx="24" fill="black"/>
                </mask>
              </defs>
              <g clip-path="url(#fortreRightHalf)" mask="url(#fortreDollarMask)" stroke="#276466" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter">
                <path d="M100 18 L120 24.5 L120 38 L144 45.5 L144 32 L166 39 L166 118 C166 164 138 198 100 220"/>
                <path d="M100 50 L166 71"/>
                <path d="M100 66 L150 82 L150 116 C150 153 128 180 100 198"/>
                <path d="M100 82 L134 93 L134 114 C134 142 118 163 100 177"/>
                <path d="M150 96 L116 126"/>
                <path d="M118 124 L118 185"/>
              </g>
              <g mask="url(#fortreDollarMask)" stroke="#E8C68E" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter">
                <path d="M34 71 L34 39 L56 32 L56 45.5 L80 38 L80 24.5 L100 18 L120 24.5 L120 38 L144 45.5 L144 32 L166 39 L166 71"/>
                <path d="M34 71 L100 50 L166 71"/>
                <path d="M34 71 L34 118 C34 164 62 198 100 220 L100 18"/>
                <path d="M100 66 L50 82 L50 116 C50 153 72 180 100 198"/>
                <path d="M100 82 L66 93 L66 114 C66 142 82 163 100 177"/>
                <path d="M82 72 L82 104"/>
                <path d="M46 156 L82 126"/>
                <path d="M56 173 L82 151 L82 184"/>
              </g>
              <g stroke="#E8C68E" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="round">
                <line x1="95.5" y1="74" x2="95.5" y2="85"/>
                <line x1="104.5" y1="74" x2="104.5" y2="85"/>
                <line x1="95.5" y1="155" x2="95.5" y2="166"/>
                <line x1="104.5" y1="155" x2="104.5" y2="166"/>
                <path d="M118 103 C118 90 109 84 100 84 C89 84 81 91 81 102 C81 114 91 119 101 122 C110 125 113 128 113 135 C113 142 107 146 100 146 C93 146 88 142 87 135 L80 135 C81 147 89 155 100 155 C112 155 121 147 121 135 C121 122 111 117 100 113 C92 110 89 107 89 101 C89 95 94 92 100 92 C106 92 110 96 111 103 Z" fill="#0F172A"/>
              </g>
            </svg>
          </div>
          <div>
            <h1 class="text-3xl font-black text-slate-900 dark:text-[#E5C158] tracking-tight leading-none font-sans">Fortre</h1>
            <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 tracking-wide mt-1">Money Tracker & Budget Manager</p>
          </div>
        </div>

        <template x-if="authFeedback">
          <div class="p-3 rounded-xl text-xs font-medium border flex items-start gap-2"
               :class="authFeedback.type === 'error' ? 'bg-red-500/10 border-red-500/30 text-red-500' : 'bg-blue-500/10 border-blue-500/30 text-blue-600 dark:text-blue-300'">
            <span x-text="authFeedback.message"></span>
          </div>
        </template>

        <!-- Forgot Password View -->
        <template x-if="authView === 'forgot'">
          <form @submit.prevent="submitForgotPassword()" class="space-y-4">
            <div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white" x-text="t('auth.forgotTitle')"></h2>
              <p class="text-xs text-slate-500 mt-0.5" x-text="t('auth.forgotDesc')"></p>
            </div>
            <div>
              <label class="text-xs font-semibold block mb-1" x-text="t('auth.emailLabel')"></label>
              <input type="email" required x-model="authForm.email" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-sm cursor-pointer" x-text="t('auth.forgotSubmit')"></button>
            <button type="button" @click="authView = 'login'; authFeedback = null" class="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold cursor-pointer" x-text="t('auth.backToLogin')"></button>
          </form>
        </template>

        <!-- Login / Sign-Up Flow -->
        <template x-if="authView !== 'forgot'">
          <div class="space-y-4">
            <button type="button" @click="loginWithGoogle()" class="w-full py-2.5 px-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 font-semibold text-sm flex items-center justify-center gap-2.5 cursor-pointer">
              <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/><path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/></svg>
              <span>Continue with Google</span>
            </button>

            <div class="relative flex items-center py-1">
              <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
              <span class="shrink mx-3 text-[11px] font-medium text-slate-400" x-text="t('auth.orDivider')"></span>
              <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
            </div>

            <div class="grid grid-cols-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <button type="button" @click="authView = 'login'; authFeedback = null" :class="authView === 'login' ? 'bg-white dark:bg-[#0F172A] text-slate-900 dark:text-white shadow-sm' : 'text-slate-500'" class="py-2 rounded-lg text-xs font-bold cursor-pointer" x-text="t('auth.loginTab')"></button>
              <button type="button" @click="authView = 'signup'; authFeedback = null" :class="authView === 'signup' ? 'bg-white dark:bg-[#0F172A] text-slate-900 dark:text-white shadow-sm' : 'text-slate-500'" class="py-2 rounded-lg text-xs font-bold cursor-pointer" x-text="t('auth.signupTab')"></button>
            </div>

            <form @submit.prevent="submitEmailAuth()" class="space-y-3">
              <template x-if="authView === 'signup'">
                <div>
                  <label class="text-xs font-semibold block mb-1" x-text="t('auth.fullNameLabel')"></label>
                  <input type="text" required x-model="authForm.fullName" placeholder="Rafli Ramadhani" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
                </div>
              </template>
              <div>
                <label class="text-xs font-semibold block mb-1" x-text="t('auth.emailLabel')"></label>
                <input type="email" required x-model="authForm.email" placeholder="nama@email.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
              </div>
              <div>
                <div class="flex items-center justify-between mb-1">
                  <label class="text-xs font-semibold" x-text="t('auth.passwordLabel')"></label>
                  <button type="button" x-show="authView === 'login'" @click="authView = 'forgot'; authFeedback = null" class="text-xs font-semibold text-emerald-500 hover:underline cursor-pointer">Lupa Password?</button>
                </div>
                <input type="password" required x-model="authForm.password" placeholder="••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm">
              </div>
              <button type="submit" class="w-full py-3 rounded-xl bg-slate-900 dark:bg-slate-800 text-white font-bold text-sm cursor-pointer" x-text="authView === 'signup' ? t('auth.signupTab') : t('auth.loginTab')"></button>
            </form>

            <div class="pt-2 border-t border-slate-200 dark:border-slate-800 space-y-3">
              <button type="button" @click="loginDemoMode()" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-sm shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2 cursor-pointer">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>Masuk Mode Demo</span>
              </button>
              <p class="text-[11px] text-center text-slate-500 dark:text-slate-400 font-medium" x-text="t('auth.footerNote')"></p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- =================================================================== -->
  <!-- MAIN APP SHELL (ONLY WHEN AUTHENTICATED)                            -->
  <!-- =================================================================== -->
  <div x-show="currentUser" x-cloak class="relative z-10 min-h-screen w-full">

    <!-- EMERGENCY WARNING POPUP -->
    <template x-if="budgetStatuses.exceededCount > 0 && showEmergencyWarning">
      <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4 bg-black/60 backdrop-blur-sm">
        <div class="relative w-full max-w-lg bg-white dark:bg-[#0F172A] border-2 border-red-500 rounded-t-3xl md:rounded-2xl mobile-bottom-sheet shadow-2xl overflow-hidden p-5 md:p-6 text-center">
          <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-red-600 via-rose-500 to-amber-500"></div>
          <div class="w-10 h-1.5 rounded-full bg-slate-300 dark:bg-slate-700 mx-auto mb-3 md:hidden"></div>
          <span class="inline-block px-3 py-1 rounded-xl text-xs font-bold uppercase bg-red-500/10 text-red-500 mb-2" x-text="t('optimization.exceededWarning')"></span>
          <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2" x-text="budgetStatuses.exceededCount + (lang === 'en' ? ' Categories Exceeded Budget!' : ' Kategori Melebihi Batas Anggaran!')"></h3>
          <p class="text-sm text-slate-600 dark:text-slate-300 mb-5" x-text="lang === 'en' ? 'Some categories exceeded monthly limits.' : 'Beberapa pos anggaran melebihi pagu bulanan.'"></p>
          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button @click="showEmergencyWarning = false; currentView = 'optimization'; mobileTab = 'analysis'; mobileAnalysisTab = 'budgets'" class="px-5 py-2.5 rounded-xl bg-red-600 text-white font-semibold text-sm cursor-pointer" x-text="t('nav.optimization')"></button>
            <button @click="showEmergencyWarning = false" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-semibold text-sm cursor-pointer" x-text="t('actions.dismiss')"></button>
          </div>
        </div>
      </div>
    </template>

    <!-- ================================================================= -->
    <!-- MOBILE NATIVE FINTECH UI (< md viewports)                         -->
    <!-- ================================================================= -->
    <div class="md:hidden min-h-screen pb-24 flex flex-col">
      <!-- Mobile Top Bar with Glossy Emblem + Hello, [First Name] 👋 + Subtext | Badges Strip + Theme + Story-Ring Avatar -->
      <header class="sticky top-0 z-30 safe-top-header bg-white/92 dark:bg-[#0F172A]/92 backdrop-blur-xl border-b border-slate-200/70 dark:border-slate-800/70 px-3.5 py-2.5">
        <div class="flex items-center justify-between gap-2 max-w-2xl mx-auto">
          <button type="button" @click="mobileTab = 'home'; $nextTick(() => renderMobileCharts())" class="flex items-center gap-2 min-w-0 cursor-pointer select-none text-left">
            <div class="w-11 h-11 shrink-0 fortre-logo-gloss flex items-center justify-center">
              <svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full object-contain relative z-[1]" aria-label="Fortre Emblem">
              <defs>
                <clipPath id="fortreLeftHalf"><rect x="0" y="0" width="100" height="240"/></clipPath>
                <clipPath id="fortreRightHalf"><rect x="100" y="0" width="100" height="240"/></clipPath>
                <mask id="fortreDollarMask">
                  <rect x="0" y="0" width="200" height="240" fill="white"/>
                  <rect x="74" y="68" width="52" height="104" rx="24" fill="black"/>
                </mask>
              </defs>
              <g clip-path="url(#fortreRightHalf)" mask="url(#fortreDollarMask)" stroke="#276466" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter">
                <path d="M100 18 L120 24.5 L120 38 L144 45.5 L144 32 L166 39 L166 118 C166 164 138 198 100 220"/>
                <path d="M100 50 L166 71"/>
                <path d="M100 66 L150 82 L150 116 C150 153 128 180 100 198"/>
                <path d="M100 82 L134 93 L134 114 C134 142 118 163 100 177"/>
                <path d="M150 96 L116 126"/>
                <path d="M118 124 L118 185"/>
              </g>
              <g mask="url(#fortreDollarMask)" stroke="#E8C68E" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter">
                <path d="M34 71 L34 39 L56 32 L56 45.5 L80 38 L80 24.5 L100 18 L120 24.5 L120 38 L144 45.5 L144 32 L166 39 L166 71"/>
                <path d="M34 71 L100 50 L166 71"/>
                <path d="M34 71 L34 118 C34 164 62 198 100 220 L100 18"/>

                <path d="M82 72 L82 104"/>
                <path d="M46 156 L82 126"/>
                <path d="M56 173 L82 151 L82 184"/>
              </g>
              <g stroke="#E8C68E" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="round">
                <line x1="95.5" y1="74" x2="95.5" y2="85"/>
                <line x1="104.5" y1="74" x2="104.5" y2="85"/>

  <script>
    // =========================================================================
    // SUPABASE CONFIGURATION
    // Paste your Supabase Project URL and Anon Key below to enable Cloud Auth
    // and database synchronization. When left empty (''), Fortre seamlessly
    // falls back to localStorage so all features work immediately offline.
    // =========================================================================
    const SUPABASE_URL = 'https://mrvpjkgcbdqbuvgdbabz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MgNRbA2XbT3quTN-R2ZGHg_xxUOfmZG';

    let supabaseClient = null;
    if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function fortreApp() {
      return {
        currentUser: null,
        authView: 'login',
        authForm: { fullName: '', email: '', password: '' },
        authFeedback: null,
        currentView: 'dashboard',
        mobileTab: 'home',
        mobileAnalysisTab: 'budgets',
        tabletRailExpanded: false,
        darkMode: true,
        currency: 'IDR',
        lang: 'id',
        periodMode: 'monthly',
        selectedDate: '2026-11-04',
        selectedMonth: '2026-11',
        selectedYear: '2026',
        targetSavingsRate: 30,
        showEmergencyWarning: true,
        showResetModal: false,
        syncActive: true,
        recentSearches: ['Gaji', 'Makan Siang', 'Investasi'],
        searchQuery: '',
        filterType: 'all',
        filterMethod: 'all',
        isAddModalOpen: false,
        editingTxId: null,
        isProfileModalOpen: false,
        isAppInfoOpen: false,
        isStoryModalOpen: false,
        selectedStoryWeekKey: null,
        seenStories: JSON.parse(localStorage.getItem('fortre_seen_stories') || '[]'),
        seenBadges: JSON.parse(localStorage.getItem('fortre_seen_badges') || '[]'),
        profileNameInput: '',
        profileEmojiInput: '',
        profileUrlInput: '',
        amountExpr: '50000',
        isAiWidgetOpen: false,
        chatInput: '',
        chatMessages: [{ sender: 'assistant', text: 'Halo! Saya asisten finansial pintar Fortre.' }],
        formTx: { description: '', purchaseLocation: '', amount: 50000, type: 'expense', category: 'Makanan & Minuman', paymentMethod: 'Transfer Bank', date: '2026-11-04' },
        transactions: [
          { id: 'tx-1', description: 'Gaji Kantor Tech', purchaseLocation: 'Transfer Payroll', amount: 15000000, type: 'income', category: 'Gaji', paymentMethod: 'Transfer Bank', date: '2026-11-01' },
          { id: 'tx-2', description: 'Belanja Shopee Flash Sale', purchaseLocation: 'Shopee Mall', amount: 1850000, type: 'expense', category: 'Belanja', paymentMethod: 'Transfer Bank', date: '2026-11-02' },
          { id: 'tx-3', description: 'Kopi & Makan Siang Gojek', purchaseLocation: 'Kopi Kenangan', amount: 145000, type: 'expense', category: 'Makanan & Minuman', paymentMethod: 'QRIS', date: '2026-11-03' },
          { id: 'tx-4', description: 'Bensin & Tol Mobil', purchaseLocation: 'SPBU Pertamina', amount: 350000, type: 'expense', category: 'Transportasi', paymentMethod: 'Cash', date: '2026-11-03' },
          { id: 'tx-5', description: 'Project Freelance Design', purchaseLocation: 'Studio Klien', amount: 3500000, type: 'income', category: 'Investasi', paymentMethod: 'Transfer Bank', date: '2026-11-04' }
        ],
        savingsGoals: [
          { id: 'g1', title: 'Dana Darurat 6 Bulan', targetAmount: 30000000, currentAmount: 18500000 },
          { id: 'g2', title: 'Liburan Akhir Tahun', targetAmount: 15000000, currentAmount: 8500000 }
        ],
        assets: [
          { id: 'a1', name: 'Tabungan BCA', amount: 48500000, category: 'Kas & Bank' },
          { id: 'a2', name: 'Portofolio Saham & Reksadana', amount: 82000000, category: 'Investasi' }
        ],
        liabilities: [{ id: 'l1', name: 'Sisa Pokok KPR', amount: 185000000, category: 'KPR' }],
        debts: [{ id: 'd1', name: 'KPR Griya Asri', totalDebt: 320000000, remainingDebt: 185000000, monthlyPayment: 3850000, dueDate: 'Tanggal 10 tiap bulan' }],
        subscriptions: [
          { id: 's1', name: 'Netflix Premium 4K', amount: 186000, category: 'Hiburan', nextBillingDate: '2026-11-18', active: true },
          { id: 's2', name: 'Spotify Family', amount: 86900, category: 'Hiburan', nextBillingDate: '2026-11-22', active: true },
          { id: 's3', name: 'IndiHome 100Mbps', amount: 425000, category: 'Tagihan', nextBillingDate: '2026-11-20', active: false }
        ],
        budgets: { 'Makanan & Minuman': 3000000, 'Transportasi': 1500000, 'Tagihan': 2000000, 'Belanja': 1500000, 'Hiburan': 1000000 },

        async initApp() {
          const savedTheme = localStorage.getItem('fortre_theme');
          this.darkMode = savedTheme !== 'light';
          document.documentElement.classList.toggle('dark', this.darkMode);

          const savedUser = localStorage.getItem('fortre_auth_user');
          if (savedUser) {
            try { this.currentUser = JSON.parse(savedUser); } catch(e) {}
          }
          const savedSync = localStorage.getItem('fortre_sync_active');
          if (savedSync !== null) this.syncActive = JSON.parse(savedSync);

          if (supabaseClient) {
            try {
              const { data } = await supabaseClient.auth.getUser();
              const sbUser = data?.user;
              if (sbUser) {
                const meta = sbUser.user_metadata || {};
                const fullName = meta.full_name || meta.name || sbUser.email?.split('@')[0] || 'User';
                const avatarUrl = meta.avatar_url || meta.picture || undefined;
                this.currentUser = {
                  id: sbUser.id,
                  fullName,
                  email: sbUser.email || '',
                  provider: avatarUrl ? 'google' : 'email',
                  initials: fullName.slice(0, 2).toUpperCase(),
                  avatarUrl
                };
                localStorage.setItem('fortre_auth_user', JSON.stringify(this.currentUser));
                await this.loadCloudData();
              }
            } catch(e) {}
          }
          const params = new URLSearchParams(window.location.search);
          if (params.get('autostart') === '1' && !this.currentUser) {
            this.loginDemoMode();
          }
          if (this.currentUser) {
            this.profileNameInput = this.currentUser.fullName || '';
            this.profileUrlInput = this.currentUser.avatarUrl || '';
            this.profileEmojiInput = this.currentUser.avatarEmoji || '';
          }

          this.initDotMatrix();
          window.addEventListener('resize', () => {
            if (this.currentUser) { this.renderCharts(); this.renderMobileCharts(); }
          });
          this.$nextTick(() => {
            lucide.createIcons();
            if (this.currentUser) { this.renderCharts(); this.renderMobileCharts(); }
          });
        },


        isCloudUser() {
          return Boolean(supabaseClient && this.syncActive && this.currentUser && this.currentUser.provider !== 'demo');
        },

        async loadCloudData() {
          if (!this.isCloudUser()) return;
          try {
            const uid = this.currentUser.id;
            const [txRes, goalRes, assetRes, liabRes, debtRes, subRes, budRes, setRes] = await Promise.all([
              supabaseClient.from('transactions').select('*').eq('user_id', uid).order('date', { ascending: false }),
              supabaseClient.from('savings_goals').select('*').eq('user_id', uid),
              supabaseClient.from('assets').select('*').eq('user_id', uid),
              supabaseClient.from('liabilities').select('*').eq('user_id', uid),
              supabaseClient.from('debts').select('*').eq('user_id', uid),
              supabaseClient.from('subscriptions').select('*').eq('user_id', uid),
              supabaseClient.from('budgets').select('*').eq('user_id', uid),
              supabaseClient.from('user_settings').select('*').eq('user_id', uid).maybeSingle()
            ]);

            if (!txRes.error) {
              this.transactions = (txRes.data || []).map(r => ({
                id: r.id,
                description: r.description,
                purchaseLocation: r.purchase_location || '',
                amount: Number(r.amount) || 0,
                type: r.type,
                category: r.category,
                paymentMethod: r.payment_method,
                date: r.date
              }));
            }
            if (!goalRes.error) {
              this.savingsGoals = (goalRes.data || []).map(r => ({
                id: r.id,
                title: r.title,
                targetAmount: Number(r.target_amount) || 0,
                currentAmount: Number(r.current_amount) || 0
              }));
            }
            if (!assetRes.error) {
              this.assets = (assetRes.data || []).map(r => ({
                id: r.id,
                name: r.name,
                amount: Number(r.amount) || 0,
                category: r.category
              }));
            }
            if (!liabRes.error) {
              this.liabilities = (liabRes.data || []).map(r => ({
                id: r.id,
                name: r.name,
                amount: Number(r.amount) || 0,
                category: r.category
              }));
            }
            if (!debtRes.error) {
              this.debts = (debtRes.data || []).map(r => ({
                id: r.id,
                name: r.name,
                totalDebt: Number(r.total_debt) || 0,
                remainingDebt: Number(r.remaining_debt) || 0,
                monthlyPayment: Number(r.monthly_payment) || 0,
                dueDate: r.due_date || ''
              }));
            }
            if (!subRes.error) {
              this.subscriptions = (subRes.data || []).map(r => ({
                id: r.id,
                name: r.name,
                amount: Number(r.amount) || 0,
                category: r.category,
                nextBillingDate: r.next_billing_date || '',
                active: Boolean(r.active)
              }));
            }
            if (!budRes.error && budRes.data && budRes.data.length > 0) {
              const map = {};
              budRes.data.forEach(b => { map[b.category] = Number(b.monthly_limit) || 0; });
              this.budgets = map;
            }
            if (!setRes.error && setRes.data) {
              this.targetSavingsRate = Number(setRes.data.target_savings_rate) || 30;
              this.currency = setRes.data.currency || this.currency;
              this.lang = setRes.data.lang || this.lang;
              if (typeof setRes.data.dark_mode === 'boolean') {
                this.darkMode = setRes.data.dark_mode;
                document.documentElement.classList.toggle('dark', this.darkMode);
              }
            }

        keypadPress(ch) {

        evaluateKeypad() {
          const s = String(this.amountExpr || '').replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, '');
          if (!s) return '0';
          const tokens = s.match(/(\d+(?:\.\d+)?|[+\-*/])/g);
          if (!tokens) return '0';
          const stack = [];
          let i = 0;
          while (i < tokens.length) {
            const tok = tokens[i];
            if ((tok === '*' || tok === '/') && stack.length > 0 && i + 1 < tokens.length) {
              const l = Number(stack.pop()), r = Number(tokens[i + 1]);
              stack.push(tok === '*' ? l * r : (r !== 0 ? l / r : l));
              i += 2;
            } else if (tok === '+' || tok === '-') {
              stack.push(tok); i += 1;
            } else {
              stack.push(Number(tok) || 0); i += 1;
            }
          }
          let acc = Number(stack[0]) || 0;
          for (let j = 1; j < stack.length - 1; j += 2) {
            if (stack[j] === '+') acc += Number(stack[j + 1]) || 0;
            if (stack[j] === '-') acc -= Number(stack[j + 1]) || 0;
          }
          this.amountExpr = String(Math.max(0, Math.round(acc)));
          return this.amountExpr;
        },

        stepPeriod(dir) {

            d.setDate(d.getDate() + dir);
            this.selectedDate = d.toISOString().slice(0, 10);

          } else if (this.periodMode === 'monthly') {
            const p = this.selectedMonth.split('-').map(Number);
            let y = p[0], m = p[1] + dir;
            if (m > 12) { m = 1; y += 1; }
            if (m < 1) { m = 12; y -= 1; }
            this.selectedMonth = y + '-' + String(m).padStart(2, '0');
            this.syncFromMonth();
          } else if (this.periodMode === 'yearly') {
            this.selectedYear = String(parseInt(this.selectedYear, 10) + dir);
            this.syncFromYear();
          }
          this.$nextTick(() => { this.renderCharts(); this.renderMobileCharts(); });
        },

          if (!this.selectedDate) return;

          this.selectedYear = this.selectedDate.slice(0, 4);

        },

        syncFromMonth() {

            this.selectedMonth = yr + '-' + (this.selectedMonth || '2026-11').slice(5, 7);

        get periodTransactions() {
          return this.transactions.filter(t => {
            if (this.periodMode === 'daily') return t.date === this.selectedDate;
            if (this.periodMode === 'monthly') return (t.date || '').startsWith(this.selectedMonth);
            if (this.periodMode === 'yearly') return (t.date || '').startsWith(this.selectedYear);
            return true;
          });
        },

        get periodTotals() {
          const inc = this.periodTransactions.filter(t => t.type === 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
          const exp = this.periodTransactions.filter(t => t.type === 'expense').reduce((s, t) => s + (Number(t.amount) || 0), 0);
          const bal = inc - exp;
          const rate = inc > 0 ? Math.max(0, Math.round((bal / inc) * 100)) : 0;
          return { totalIncome: inc, totalExpense: exp, balance: bal, savingsRate: rate };
        },

        get walletBalances() {
          const buckets = {
            'Transfer Bank': 0,
            'QRIS': 0,
            'Cash': 0
          };
          this.transactions.forEach(t => {
            const raw = t.paymentMethod === 'Cash (Tunai)' ? 'Cash' : (t.paymentMethod || 'Transfer Bank');
            const key = Object.prototype.hasOwnProperty.call(buckets, raw) ? raw : 'Transfer Bank';
            const amt = Number(t.amount) || 0;
            buckets[key] += t.type === 'income' ? amt : -amt;
          });
          const positiveTotal = Math.max(0, buckets['Transfer Bank']) + Math.max(0, buckets['QRIS']) + Math.max(0, buckets['Cash']);
          const defs = [
            { method: 'Transfer Bank', label: 'Transfer Bank', icon: 'landmark', colorClass: 'text-indigo-500', bgClass: 'bg-indigo-500/12', barClass: 'bg-indigo-500' },
            { method: 'QRIS', label: 'QRIS / E-Wallet', icon: 'qr-code', colorClass: 'text-emerald-500', bgClass: 'bg-emerald-500/12', barClass: 'bg-emerald-500' },
            { method: 'Cash', label: this.lang === 'en' ? 'Cash' : 'Cash (Tunai)', icon: 'banknote', colorClass: 'text-amber-500', bgClass: 'bg-amber-500/12', barClass: 'bg-amber-500' }
          ];
          return defs.map(d => {
            const balance = buckets[d.method] || 0;
            const pct = positiveTotal > 0 && balance > 0 ? Math.round((balance / positiveTotal) * 100) : 0;
            return { ...d, balance, pct };
          });
        },

        get upcomingPayments() {
          const subs = this.subscriptions.filter(s => s.active).map(s => ({ id: s.id, title: s.name, amount: s.amount, kind: this.lang === 'en' ? 'Sub' : 'Langganan', dueLabel: s.nextBillingDate || '2026-11-30' }));
          const ds = this.debts.map(d => ({ id: d.id, title: d.name, amount: d.monthlyPayment, kind: this.lang === 'en' ? 'Loan' : 'Cicilan', dueLabel: d.dueDate }));
          return [...subs, ...ds];
        },

        get budgetStatuses() {
          const items = [];
          let exceeded = 0;
          Object.keys(this.budgets).forEach(cat => {
            const limit = this.budgets[cat];
            const spent = this.periodTransactions.filter(t => t.type === 'expense' && t.category === cat).reduce((s, t) => s + t.amount, 0);
            const pct = limit > 0 ? Math.round((spent / limit) * 100) : 0;
            if (pct > 100) exceeded++;
            items.push({ category: cat, spent, monthlyLimit: limit, percentage: pct, status: pct > 100 ? 'exceeded' : 'safe' });
          });
          return { items, exceededCount: exceeded };
        },

        get financialHealth() {
          const score = Math.min(100, Math.max(20, Math.round(this.periodTotals.savingsRate * 1.2 + (this.budgetStatuses.exceededCount === 0 ? 40 : 15))));

        filteredTransactions() {

            if (this.filterType !== 'all' && t.type !== this.filterType) return false;
            if (this.filterMethod !== 'all' && t.paymentMethod !== this.filterMethod) return false;
            if (this.searchQuery) {

              return t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || (t.purchaseLocation || '').toLowerCase().includes(q);

            return true;
          });

        get historySummaryRows() {
          if (this.periodMode === 'all') {
            const inc = this.transactions.filter(t => t.type === 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
            const exp = this.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + (Number(t.amount) || 0), 0);
            return [{ key: 'all', label: this.lang === 'en' ? 'All Time' : 'Semua Periode', count: this.transactions.length, income: inc, expense: exp, net: inc - exp }];
          }
          const map = new Map();
          this.transactions.forEach(t => {
            const d = t.date || '2026-11-04';
            const key = this.periodMode === 'yearly' ? d.slice(0, 4) : (this.periodMode === 'monthly' ? d.slice(0, 7) : d);
            const cur = map.get(key) || { key, label: key, count: 0, income: 0, expense: 0, net: 0 };
            cur.count += 1;
            if (t.type === 'income') cur.income += Number(t.amount) || 0;
            else cur.expense += Number(t.amount) || 0;
            cur.net = cur.income - cur.expense;
            map.set(key, cur);
          });
          return Array.from(map.values()).sort((a, b) => b.key.localeCompare(a.key));
        },

        jumpToHistoryPeriod(key) {
          if (key === 'all') this.periodMode = 'all';
          else if (this.periodMode === 'yearly') { this.selectedYear = key; this.syncFromYear(); }
          else if (this.periodMode === 'monthly') { this.selectedMonth = key; this.syncFromMonth(); }
          else { this.selectedDate = key; this.syncFromDate(); }
          this.$nextTick(() => { this.renderCharts(); this.renderMobileCharts(); });
        },

        get expenseAllocationItems() {
          const map = new Map();
          let total = 0;
          this.periodTransactions.filter(t => t.type === 'expense').forEach(t => {
            const amt = Number(t.amount) || 0;
            total += amt;
            map.set(t.category, (map.get(t.category) || 0) + amt);
          });
          return Array.from(map.entries()).map(([category, amount]) => ({
            category,
            amount,
            pct: total > 0 ? Math.round((amount / total) * 100) : 0
          })).sort((a, b) => b.amount - a.amount);
        },

        isSundayIso(iso) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return false;
          const [y, m, d] = iso.split('-').map(Number);
          return new Date(y, m - 1, d).getDay() === 0;

          return new Date().getDay() === 0 || this.isSundayIso(this.selectedDate);

        nextSundayIso() {
          const base = /^\d{4}-\d{2}-\d{2}$/.test(this.selectedDate || '') ? new Date(this.selectedDate + 'T12:00:00') : new Date();
          const day = base.getDay();
          const add = day === 0 ? 0 : 7 - day;
          base.setDate(base.getDate() + add);
          return base.toISOString().slice(0, 10);
        },

        get weeklyStories() {
          const weeks = new Map();
          this.transactions.forEach(tx => {
            const d = new Date((tx.date || '2026-11-04') + 'T00:00:00');
            const day = d.getDay() || 7;
            const monday = new Date(d);
            monday.setDate(d.getDate() - day + 1);
            const wk = monday.toISOString().slice(0, 10);
            const arr = weeks.get(wk) || [];
            arr.push(tx);
            weeks.set(wk, arr);
          });
          const keys = Array.from(weeks.keys()).sort((a, b) => b.localeCompare(a));
          if (keys.length === 0) keys.push('2026-11-02');
          return keys.map(wk => {
            const txs = weeks.get(wk) || [];
            const inc = txs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            const exp = txs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            const net = inc - exp;
            const rate = inc > 0 ? Math.max(0, Math.round((net / inc) * 100)) : 0;
            const endD = new Date(wk + 'T00:00:00'); endD.setDate(endD.getDate() + 6);
            const topCat = this.expenseAllocationItems[0]?.category || 'Makanan & Minuman';
            return {
              weekKey: wk,
              rangeLabel: wk + ' – ' + endD.toISOString().slice(0, 10),
              income: inc,
              expense: exp,
              netFlow: net,
              savingsRate: rate,
              txCount: txs.length,
              topCat,
              headline: net >= 0 ? (this.lang === 'en' ? 'Healthy Weekly Surplus' : 'Surplus Mingguan Sehat') : (this.lang === 'en' ? 'High Expense Alert' : 'Waspada Pengeluaran Tinggi'),
              tip: this.lang === 'en'
                ? 'Focus budget discipline on ' + topCat + ' and keep logging every QRIS transaction to elevate your Financial Health Score.'
                : 'Fokus jaga disiplin anggaran di pos ' + topCat + ' & terus catat transaksi harian untuk menaikkan Skor Kesehatan Finansial.'
            };
          });
        },

        get activeStory() {
          if (this.selectedStoryWeekKey) {
            return this.weeklyStories.find(s => s.weekKey === this.selectedStoryWeekKey) || this.weeklyStories[0];
          }
          return this.weeklyStories[0];
        },
        get hasUnseenStory() { return this.weeklyStories[0] && !this.seenStories.includes(this.weeklyStories[0].weekKey); },
        openStoryModal(weekKey = null) {
          this.selectedStoryWeekKey = weekKey;
          this.isStoryModalOpen = true;
          if (this.activeStory && !this.seenStories.includes(this.activeStory.weekKey)) {
            this.seenStories.push(this.activeStory.weekKey);
            localStorage.setItem('fortre_seen_stories', JSON.stringify(this.seenStories));
          }
          this.$nextTick(() => lucide.createIcons());
        },

        async depositGoal(id, amt) {
          const g = this.savingsGoals.find(x => x.id === id);
          if (g) {
            g.currentAmount = Math.min(g.targetAmount * 2, g.currentAmount + amt);
            if (this.isCloudUser()) {
              await supabaseClient.from('savings_goals').update({ current_amount: g.currentAmount }).eq('id', id).eq('user_id', this.currentUser.id);
            }
          }
        },

        addRecentSearch(q) {
          const t = (q || '').trim();
          if (t) this.recentSearches = [t, ...this.recentSearches.filter(x => x !== t)].slice(0, 6);
        },

        formatMoney(amt) {
          const rates = { IDR: 1, USD: 1 / 16000, EUR: 1 / 17500, SGD: 1 / 12000 };
          const val = (amt || 0) * (rates[this.currency] || 1);
          if (this.currency === 'IDR') return 'Rp ' + Math.round(val).toLocaleString('id-ID');
          if (this.currency === 'USD') return '$' + val.toFixed(2);
          if (this.currency === 'EUR') return '€' + val.toFixed(2);
          return 'S$' + val.toFixed(2);
        },

        async toggleSubscription(id) {
          const s = this.subscriptions.find(x => x.id === id);
          if (s) {
            s.active = !s.active;
            if (this.isCloudUser()) {
              await supabaseClient.from('subscriptions').update({ active: s.active }).eq('id', id).eq('user_id', this.currentUser.id);
            }
          }
        },

        openAddModal() {
          this.editingTxId = null;
          this.formTx = { description: '', purchaseLocation: '', amount: 50000, type: 'expense', category: 'Makanan & Minuman', paymentMethod: 'Transfer Bank', date: this.selectedDate || '2026-11-04' };
          this.amountExpr = '50000';
          this.isAddModalOpen = true;
        },

        startEditTransaction(tx) {
          this.editingTxId = tx.id;
          this.formTx = { description: tx.description, purchaseLocation: tx.purchaseLocation || '', amount: tx.amount, type: tx.type, category: tx.category, paymentMethod: tx.paymentMethod, date: tx.date };
          this.amountExpr = String(tx.amount);
          this.isAddModalOpen = true;
        },

        async addTransaction() {
          const finalAmt = Number(this.evaluateKeypad()) || 0;
          if (!this.formTx.description || finalAmt <= 0) return;
          if (this.editingTxId) {
            const editId = this.editingTxId;
            this.transactions = this.transactions.map(t => t.id === editId ? { ...t, ...this.formTx, amount: finalAmt } : t);
            if (this.isCloudUser()) {
              await supabaseClient.from('transactions').update({
                description: this.formTx.description,
                purchase_location: this.formTx.purchaseLocation || '',
                amount: finalAmt,
                type: this.formTx.type,
                category: this.formTx.category,
                payment_method: this.formTx.paymentMethod,
                date: this.formTx.date
              }).eq('id', editId).eq('user_id', this.currentUser.id);
            }
          } else {
            const newId = 'tx-' + Date.now();
            const newTx = { id: newId, ...this.formTx, amount: finalAmt };
            this.transactions.unshift(newTx);
            if (this.isCloudUser()) {
              await supabaseClient.from('transactions').insert({
                id: newId,
                user_id: this.currentUser.id,
                description: newTx.description,
                purchase_location: newTx.purchaseLocation || '',
                amount: newTx.amount,
                type: newTx.type,
                category: newTx.category,
                payment_method: newTx.paymentMethod,
                date: newTx.date
              });
            }
          }
          this.editingTxId = null;
          this.isAddModalOpen = false;
          this.formTx.description = '';
          this.formTx.purchaseLocation = '';
          this.amountExpr = '';
          this.$nextTick(() => { lucide.createIcons(); this.renderCharts(); this.renderMobileCharts(); });
        },

        async deleteTransaction(id) {
          this.transactions = this.transactions.filter(t => t.id !== id);
          if (this.isCloudUser()) {
            await supabaseClient.from('transactions').delete().eq('id', id).eq('user_id', this.currentUser.id);
          }
          this.$nextTick(() => { this.renderCharts(); this.renderMobileCharts(); });
        },

        async resetAllData() {
          this.transactions = []; this.savingsGoals = []; this.assets = []; this.liabilities = []; this.debts = []; this.subscriptions = [];
          this.showResetModal = false;
          if (this.isCloudUser()) {
            const uid = this.currentUser.id;
            await Promise.all([
              supabaseClient.from('transactions').delete().eq('user_id', uid),
              supabaseClient.from('savings_goals').delete().eq('user_id', uid),
              supabaseClient.from('assets').delete().eq('user_id', uid),
              supabaseClient.from('liabilities').delete().eq('user_id', uid),
              supabaseClient.from('debts').delete().eq('user_id', uid),
              supabaseClient.from('subscriptions').delete().eq('user_id', uid)
            ]);
          }
          this.$nextTick(() => { this.renderCharts(); this.renderMobileCharts(); });
        },

        buildCashflowSeries() {
          const map = new Map();
          this.periodTransactions.forEach(t => {
            const key = this.periodMode === 'yearly' ? (t.date || '').slice(0, 7) : (t.date || '').slice(5);
            const cur = map.get(key) || { income: 0, expense: 0 };
            if (t.type === 'income') cur.income += Number(t.amount) || 0;
            else cur.expense += Number(t.amount) || 0;
            map.set(key, cur);
          });
          const labels = Array.from(map.keys()).sort();
          if (labels.length === 0) labels.push('—');
          return {
            labels,
            incomes: labels.map(l => map.get(l)?.income || 0),
            expenses: labels.map(l => map.get(l)?.expense || 0)
          };
        },

        renderMobileCharts() {
          if (!window.Chart) return;
          const series = this.buildCashflowSeries();
          const mTrend = document.getElementById('mobileTrendChart');
          if (mTrend) {
            if (window._mTrendInst) window._mTrendInst.destroy();
            const mCtx = mTrend.getContext('2d');
            const mIncGrad = mCtx ? (() => { const g = mCtx.createLinearGradient(0, 0, 0, 150); g.addColorStop(0, 'rgba(110, 231, 183, 0.30)'); g.addColorStop(1, 'rgba(110, 231, 183, 0)'); return g; })() : 'rgba(110,231,183,0.16)';
            const mExpGrad = mCtx ? (() => { const g = mCtx.createLinearGradient(0, 0, 0, 150); g.addColorStop(0, 'rgba(253, 164, 175, 0.22)'); g.addColorStop(1, 'rgba(253, 164, 175, 0)'); return g; })() : 'rgba(253,164,175,0.12)';
            window._mTrendInst = new Chart(mTrend, {
              type: 'line',
              data: {
                labels: series.labels,
                datasets: [
                  { label: this.t('headerCard.income'), data: series.incomes, borderColor: '#6ee7b7', backgroundColor: mIncGrad, fill: 'start', tension: 0.22, borderWidth: 2.5, pointRadius: 0, pointHitRadius: 12, pointHoverRadius: 5, pointBackgroundColor: '#34d399', pointBorderColor: '#ffffff', pointBorderWidth: 2 },
                  { label: this.t('headerCard.expense'), data: series.expenses, borderColor: '#fda4af', backgroundColor: mExpGrad, fill: 'start', tension: 0.22, borderWidth: 2.5, pointRadius: 0, pointHitRadius: 12, pointHoverRadius: 5, pointBackgroundColor: '#fb7185', pointBorderColor: '#ffffff', pointBorderWidth: 2 }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { display: false } },
                scales: {
                  x: { grid: { display: false }, border: { display: false }, ticks: { color: 'rgba(255,255,255,0.78)', font: { size: 9, weight: 600 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } },
                  y: { position: 'right', beginAtZero: true, border: { display: false }, grid: { color: 'rgba(255,255,255,0.12)' }, ticks: { color: 'rgba(255,255,255,0.75)', font: { size: 9 }, maxTicksLimit: 4 } }
                }
              }
            });
          }

          const mDonut = document.getElementById('mobileExpenseDonut');
          if (mDonut) {
            if (window._mDonutInst) window._mDonutInst.destroy();
            const items = this.expenseAllocationItems;
            window._mDonutInst = new Chart(mDonut, {
              type: 'doughnut',
              data: {
                labels: items.length ? items.map(x => x.category) : ['—'],
                datasets: [{ data: items.length ? items.map(x => x.amount) : [1], backgroundColor: ['#f97316', '#3b82f6', '#ef4444', '#8b5cf6', '#10b981'] }]
              },
              options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false } } }
            });
          }
        },

        renderCharts() {
          if (!window.Chart) return;
          const donutCtx = document.getElementById('donutChart');
          if (donutCtx) {
            if (window._donutChartInst) window._donutChartInst.destroy();
            const items = this.expenseAllocationItems;
            window._donutChartInst = new Chart(donutCtx, {
              type: 'doughnut',
              data: { labels: items.length ? items.map(x => x.category) : ['—'], datasets: [{ data: items.length ? items.map(x => x.amount) : [1], backgroundColor: ['#f97316', '#3b82f6', '#ef4444', '#8b5cf6', '#10b981'] }] },
              options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false } } }
            });
          }
          const trendCtx = document.getElementById('trendChart');
          if (trendCtx) {
            if (window._trendChartInst) window._trendChartInst.destroy();
            const series = this.buildCashflowSeries();
            const tickC = this.darkMode ? '#94a3b8' : '#64748b';
            const gridC = this.darkMode ? 'rgba(51, 65, 85, 0.28)' : 'rgba(226, 232, 240, 0.7)';
            const ptBorder = this.darkMode ? '#0F172A' : '#ffffff';
            const dCtx = trendCtx.getContext('2d');
            const dIncGrad = dCtx ? (() => { const g = dCtx.createLinearGradient(0, 0, 0, 260); g.addColorStop(0, this.darkMode ? 'rgba(16, 185, 129, 0.28)' : 'rgba(16, 185, 129, 0.20)'); g.addColorStop(1, 'rgba(16, 185, 129, 0)'); return g; })() : 'rgba(16,185,129,0.12)';
            const dExpGrad = dCtx ? (() => { const g = dCtx.createLinearGradient(0, 0, 0, 260); g.addColorStop(0, this.darkMode ? 'rgba(244, 63, 94, 0.22)' : 'rgba(244, 63, 94, 0.16)'); g.addColorStop(1, 'rgba(244, 63, 94, 0)'); return g; })() : 'rgba(244,63,94,0.10)';
            window._trendChartInst = new Chart(trendCtx, {
              type: 'line',
              data: {
                labels: series.labels,
                datasets: [
                  { label: this.t('headerCard.income'), data: series.incomes, borderColor: '#10b981', backgroundColor: dIncGrad, fill: 'start', tension: 0.22, borderWidth: 2.5, pointRadius: 0, pointHitRadius: 12, pointHoverRadius: 5, pointBackgroundColor: '#10b981', pointBorderColor: ptBorder, pointBorderWidth: 2 },
                  { label: this.t('headerCard.expense'), data: series.expenses, borderColor: '#f43f5e', backgroundColor: dExpGrad, fill: 'start', tension: 0.22, borderWidth: 2.5, pointRadius: 0, pointHitRadius: 12, pointHoverRadius: 5, pointBackgroundColor: '#f43f5e', pointBorderColor: ptBorder, pointBorderWidth: 2 }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { display: false } },
                scales: {
                  x: { grid: { display: false }, border: { display: false }, ticks: { color: tickC, font: { size: 11, weight: 600 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } },
                  y: { position: 'right', beginAtZero: true, border: { display: false }, grid: { color: gridC }, ticks: { color: tickC, font: { size: 11 }, maxTicksLimit: 5 } }
                }
              }
            });
          }
        },

        renderCompoundChart() {
          const ctx = document.getElementById('compoundChart');
          if (!ctx || !window.Chart) return;
          if (window._compoundInst) window._compoundInst.destroy();
          window._compoundInst = new Chart(ctx, {
            type: 'line',
            data: { labels: ['Y1', 'Y2', 'Y3', 'Y4', 'Y5'], datasets: [{ label: 'Growth', data: [24000000, 38000000, 52000000, 67000000, 83000000], borderColor: '#10b981' }] },
            options: { responsive: true, maintainAspectRatio: false }
          });
        },

        sendChat() {
          if (!this.chatInput.trim()) return;
          this.chatMessages.push({ sender: 'user', text: this.chatInput });
          this.chatInput = '';
          this.chatMessages.push({ sender: 'assistant', text: (this.lang === 'en' ? 'Net Balance: ' : 'Saldo Bersih: ') + this.formatMoney(this.periodTotals.balance) });
        },

        downloadExcel() {
          const ws = XLSX.utils.json_to_sheet(this.transactions);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
          XLSX.writeFile(wb, 'Fortre-Report.xlsx');
        },

        downloadCSV() {
          const csv = 'Date,Description,PurchaseLocation,Category,Method,Amount,Type\n' + this.transactions.map(t => `${t.date},${t.description},${t.purchaseLocation || ''},${t.category},${t.paymentMethod},${t.amount},${t.type}`).join('\n');
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'Fortre-Transactions.csv'; a.click();
        },

        downloadPDF() {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.text('Fortre - Money Tracker & Budget Manager', 14, 20);
          doc.text('Balance: ' + this.formatMoney(this.periodTotals.balance), 14, 30);
          doc.save('Fortre-Report.pdf');
        },

        forceBackupJSON() {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([JSON.stringify({ transactions: this.transactions, budgets: this.budgets }, null, 2)], { type: 'application/json' }));
          a.download = 'Fortre-Backup.json'; a.click();
        },

        get badgesList() {
          return [
            { id: 'b1', icon: 'shield-check', colorClass: 'text-emerald-500', bgClass: 'bg-emerald-500/15', titleId: 'Budget Master', titleEn: 'Budget Master', descId: 'Menjaga pengeluaran di bawah pagu.', descEn: 'Keep spending within budgets.', progress: this.budgetStatuses.exceededCount === 0 ? 100 : 50 },
            { id: 'b2', icon: 'piggy-bank', colorClass: 'text-amber-500', bgClass: 'bg-amber-500/15', titleId: 'Consistent Saver', titleEn: 'Consistent Saver', descId: 'Rasio tabungan melampaui target.', descEn: 'Savings rate exceeds target.', progress: Math.min(100, Math.round((this.periodTotals.savingsRate / Math.max(1, this.targetSavingsRate)) * 100)) },
            { id: 'b3', icon: 'umbrella', colorClass: 'text-sky-500', bgClass: 'bg-sky-500/15', titleId: 'Emergency Shield', titleEn: 'Emergency Shield', descId: 'Menyiapkan dana darurat tangguh.', descEn: 'Build a resilient emergency fund.', progress: this.savingsGoals.some(g => g.currentAmount >= 10000000) ? 100 : 40 },
            { id: 'b4', icon: 'flame', colorClass: 'text-rose-500', bgClass: 'bg-rose-500/15', titleId: 'QRIS Tracker', titleEn: 'QRIS Tracker', descId: 'Mencatat transaksi digital & QRIS.', descEn: 'Log digital & QRIS transactions.', progress: this.transactions.length >= 5 ? 100 : this.transactions.length * 20 },
            { id: 'b5', icon: 'trending-up', colorClass: 'text-indigo-500', bgClass: 'bg-indigo-500/15', titleId: 'Wealth Builder', titleEn: 'Wealth Builder', descId: 'Menumbuhkan portofolio aset.', descEn: 'Grow positive investment assets.', progress: this.assets.length > 0 ? 100 : 0 },
            { id: 'b6', icon: 'crown', colorClass: 'text-purple-500', bgClass: 'bg-purple-500/15', titleId: 'Skor Prima', titleEn: 'Prime Health', descId: 'Skor Kesehatan Finansial >= 80.', descEn: 'Financial Health Score >= 80.', progress: this.financialHealth.score >= 80 ? 100 : Math.round((this.financialHealth.score / 80) * 100) }
          ];
        },
        get unlockedBadges() { return this.badgesList.filter(b => b.progress >= 100); },
        get hasNewBadge() { return this.unlockedBadges.some(b => !this.seenBadges.includes(b.id)); },
        markBadgesSeen() {
          this.seenBadges = Array.from(new Set([...this.seenBadges, ...this.unlockedBadges.map(b => b.id)]));
          localStorage.setItem('fortre_seen_badges', JSON.stringify(this.seenBadges));
        },
        badgeIconSvg(icon, sizeClass = 'w-4 h-4') {
          const paths = {
            'shield-check': '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
            'piggy-bank': '<path d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"/><path d="M16 10h.01"/><path d="M2 8v1a2 2 0 0 0 2 2h1"/>',
            'umbrella': '<path d="M12 13v7a2 2 0 0 0 4 0"/><path d="M12 2v2"/><path d="M20.992 13a1 1 0 0 0 .97-1.274 10.284 10.284 0 0 0-19.923 0A1 1 0 0 0 3 13z"/>',
            'flame': '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
            'trending-up': '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
            'crown': '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>'
          };
          const inner = paths[icon] || paths['shield-check'];
          return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${sizeClass}">${inner}</svg>`;
        },
        walletIconSvg(icon, sizeClass = 'w-4 h-4') {
          const paths = {
            'landmark': '<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
            'qr-code': '<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',
            'banknote': '<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>'
          };
          const inner = paths[icon] || paths['landmark'];
          return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${sizeClass}">${inner}</svg>`;
        },

        initDotMatrix() {
          const canvas = document.getElementById('dotMatrixCanvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let w = canvas.width = window.innerWidth;
          let h = canvas.height = window.innerHeight;
          const drops = Array(Math.floor(w / 28)).fill(0).map(() => Math.random() * -100);
          const self = this;
          function draw() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = self.darkMode ? 'rgba(255, 255, 255, 0.14)' : 'rgba(15, 23, 42, 0.08)';
            for (let i = 0; i < drops.length; i++) {
              ctx.beginPath();
              ctx.arc(i * 28 + 14, drops[i], 1.3, 0, Math.PI * 2);
              ctx.fill();
              if (drops[i] > h && Math.random() > 0.985) drops[i] = 0;
              else drops[i] += 0.65;
            }
            requestAnimationFrame(draw);
          }
          draw();
        }
      };
    }
  </script>
